<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193d44"><title>知序 · 提示词工程自学与练习</title>
<style>
:root{--ink:#193d44;--teal:#18746b;--bg:#f5f4ed;--paper:#fffef9;--line:#d9e1da;--muted:#607574;--accent:#af6845;--soft:#eaf1eb;--red:#a13f38;--shadow:0 8px 30px #193d4408}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 16px;transition:background .15s}button:hover{background:var(--soft)}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d28b61;outline-offset:3px}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.primary:hover{background:var(--teal)}a{color:var(--teal);text-decoration-thickness:1px;text-underline-offset:4px}p{margin:.65em 0 1em}h1,h2,h3{line-height:1.35;letter-spacing:-.025em}h1{font-family:"Songti SC",serif;font-size:clamp(30px,4vw,48px);font-weight:600;margin:.3em 0 .5em}h2{font-size:25px}h3{font-size:19px}.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}.sidebar{padding:28px 20px;border-right:1px solid var(--line);background:#edf1e9;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:26px;letter-spacing:.08em;font-family:"Songti SC",serif;font-weight:700}.brand span{font:11px/1 sans-serif;letter-spacing:.18em;display:block;margin:5px 0 28px;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:650}.chapter-nav{display:grid;gap:5px;margin-top:12px}.chapter-nav button{text-align:left;display:flex;gap:12px;background:none;border:0;padding:9px 10px;font-size:14px;align-items:center}.chapter-nav button.active{background:var(--ink);color:white}.num{font:12px/1.5 monospace;opacity:.6}.chapter-nav small{margin-left:auto;font:11px monospace}.aside-bottom{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.main{padding:26px clamp(22px,4vw,66px) 65px;max-width:1240px;width:100%;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.tabs{display:flex;gap:5px}.tabs button{border:0;background:none;color:var(--muted);border-radius:0;padding:7px 10px;font-size:14px}.tabs button.active{color:var(--ink);border-bottom:2px solid var(--teal)}.local{font-size:12px;color:var(--muted)}.local::before{content:'●';color:var(--teal);margin-right:7px}.hero{padding:28px 0 33px;border-bottom:1px solid var(--line);margin-bottom:27px;position:relative}.hero p{max-width:600px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{padding:18px 20px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.stat strong{display:block;font:30px/1.3 Georgia,serif}.stat small{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:23px;box-shadow:var(--shadow)}.card h3{margin:5px 0 9px}.card p{font-size:14px;color:var(--muted)}.card .eyebrow{color:var(--accent)}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--muted)}.card-foot button{padding:5px 12px;font-size:13px}.progress{height:4px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:15px}.progress i{display:block;background:var(--teal);height:100%}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(20px,3vw,38px);box-shadow:var(--shadow)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px}.toolbar label{font-size:13px}.toolbar select,.toolbar input[type=search]{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);max-width:100%}.toolbar input[type=search]{flex:1;min-width:140px}.badge{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--muted)}.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.question{font-size:21px;line-height:1.75;font-weight:550;margin:23px 0}.option{display:flex;align-items:flex-start;gap:13px;border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin:10px 0;cursor:pointer;background:white;font-size:15px}.option:hover{border-color:var(--teal);background:#f6faf5}.option.selected{border-color:var(--teal);background:#edf5ee}.option.correct{border-color:var(--teal);background:#e4f1e7}.option.wrong{border-color:#c99589;background:#fbede8}.option input{margin-top:6px;accent-color:var(--teal)}.letter{font:13px/1.7 monospace;border:1px solid var(--line);min-width:26px;text-align:center;border-radius:4px}.explain{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}.result{border-radius:9px;background:var(--soft);padding:16px 20px}.result.wrong{background:#f5e9df}.result strong{display:block;font-size:19px}.note{border-left:3px solid var(--accent);background:#f7f0e5;padding:13px 17px;margin:18px 0;font-size:14px}.muted{color:var(--muted);font-size:13px}.confidence{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:14px;margin:23px 0 14px}.confidence label{cursor:pointer}.confidence input{accent-color:var(--teal)}textarea{width:100%;min-height:75px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:12px;background:#fffefb;font-size:14px}.reader{max-width:790px;margin:auto}.reader p,.reader li{line-height:1.95}.reader h2{margin-top:2em;padding-top:12px;border-top:1px solid var(--line)}.reader h3{margin-top:1.8em}.reader blockquote{margin:20px 0;padding:16px 22px;background:var(--soft);border-left:3px solid var(--teal)}.reader pre,.record pre{background:var(--soft);padding:15px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7}.reader table,.record table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}.reader td,.reader th,.record td,.record th{border-bottom:1px solid var(--line);text-align:left;padding:10px}.reader code,.record code{font-family:Menlo,Consolas,monospace;font-size:.88em;background:var(--soft);border-radius:3px;padding:2px 4px;overflow-wrap:anywhere}math{max-width:100%;overflow-x:auto;font-size:1.05em}details{margin:18px 0}summary{cursor:pointer;font-weight:600;color:var(--teal)}.record{font-size:14px;border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.record h2{font-size:20px}.record a{overflow-wrap:anywhere}.empty{text-align:center;padding:60px 15px}.empty p{color:var(--muted)}.spacer{flex:1}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:10;max-width:90vw;border-radius:10px;padding:12px 22px;background:var(--ink);color:white;font-size:14px;box-shadow:0 5px 25px #0003}.footer-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}.footer-tools button{font-size:12px;padding:7px 12px}.exam-grid{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.exam-grid button{font-size:12px;width:35px;padding:4px}.exam-grid button.done{background:var(--soft);border-color:var(--teal)}.exam-grid button.current{background:var(--ink);color:white}.line-row{display:flex;align-items:center;gap:15px;justify-content:space-between;border-bottom:1px solid var(--line);padding:13px 0;font-size:14px}.print-only{display:none}@media(max-width:900px){.shell{grid-template-columns:200px minmax(0,1fr)}.sidebar{padding:22px 12px}.main{padding:20px 25px 50px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.chapter-nav button{gap:7px;font-size:13px}}@media(max-width:620px){.shell{display:block}.sidebar{height:auto;position:relative;padding:17px 20px;border-bottom:1px solid var(--line);border-right:0}.brand{font-size:22px}.brand span{display:inline;font-size:9px;margin-left:9px}.sidebar>.eyebrow,.aside-bottom{display:none}.chapter-nav{display:flex;overflow-x:auto;gap:7px;margin-top:16px;padding-bottom:4px}.chapter-nav button{flex-shrink:0;border:1px solid var(--line);padding:6px 10px}.chapter-nav small{display:none}.main{padding:18px 16px 40px}.top{gap:7px;margin-bottom:15px}.tabs button{padding:6px 8px;font-size:13px}.local{font-size:10px}.hero{padding:16px 0 23px}h1{font-size:32px}.stats{gap:8px}.stat{padding:13px 16px}.panel{padding:19px 16px}.question{font-size:19px}.option{padding:12px 10px;gap:9px}.confidence{gap:10px}.toolbar{gap:7px}.toolbar select{max-width:100%}.actions button{flex-grow:1}.reader h2{font-size:23px}}@media print{.sidebar,.top,.toolbar,.footer-tools,button{display:none!important}.shell{display:block}.main{max-width:none;padding:0}.panel{border:0;box-shadow:none}.reader{max-width:none}body{background:white}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">知序<span>PROMPT / STUDY ATELIER</span></div><div class="eyebrow">学习目录 / 11 CHAPTERS</div><nav id="chapters" class="chapter-nav" aria-label="章节目录"></nav><div class="aside-bottom">先理解，再判断。<br>每个答案都应有一句你的理由。<p>完全离线 · 无需账号或 API<br>记录保存在此浏览器</p><a href="../../../output/pdf/提示词工程_从理解到独立应用.pdf" target="_blank">打开配套 PDF ↗</a></div></aside><main class="main"><header class="top"><nav class="tabs" aria-label="学习模式"><button data-view="home">学习路线</button><button data-view="read">读教材</button><button data-view="practice">练习</button><button data-view="exam">自测一轮</button></nav><span class="local" id="storage-status">本地保存</span></header><div id="content"></div><footer class="footer-tools"><button id="export">导出学习记录</button><button id="import">导入记录</button><button id="help">使用说明</button><button id="clear">清空本机记录</button><input type="file" accept="application/json,.json" id="import-file" hidden></footer><div id="message" class="muted" role="status" aria-live="polite"></div></main></div><div id="toast" class="toast" role="status" hidden></div>
<dialog id="confirm-dialog" aria-labelledby="confirm-title" style="max-width:460px;width:90%;border:1px solid #d9e1da;border-radius:12px;padding:24px;background:#fffef9"><h2 id="confirm-title">请确认</h2><p id="confirm-text"></p><form method="dialog" class="actions"><button value="no">取消</button><button value="yes" class="primary">确认</button></form></dialog>
<script>
'use strict';
const DATA=/*__DATA__*/;
const KEY='prompt-study-v1';
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
let storageOK=true;
let state={schema:1,attempts:[],drafts:{},notes:{},read:[],lastChapter:1,session:null};
try{const s=localStorage.getItem(KEY);if(s)state=validate(JSON.parse(s));}catch(e){storageOK=false;}
let view='home',chapter=Number(state.lastChapter)||1,mode='all',search='',shuffle=false,index=0,seed=now(),sessionResult=false;
const ids=new Set(DATA.questions.map(q=>q.id));
function validate(s){if(!s||s.schema!==1||!Array.isArray(s.attempts)||typeof s.notes!=='object'||!s.notes||!Array.isArray(s.read))throw Error('记录格式不符');const validIds=new Set(DATA.questions.map(q=>q.id));if(s.attempts.length>50000)throw Error('记录过大');for(const a of s.attempts){if(!a||!validIds.has(a.id)||!Array.isArray(a.selected)||!a.selected.every(k=>DATA.questions.find(q=>q.id===a.id).options.some(o=>o.key===k))||!['sure','unsure','guess'].includes(a.confidence)||!Number.isFinite(a.time)||!Number.isFinite(a.due))throw Error('答题记录不完整');a.correct=same(a.selected,DATA.questions.find(q=>q.id===a.id).answer);}for(const [k,v]of Object.entries(s.notes)){if(!validIds.has(k)||typeof v!=='string'||v.length>20000)throw Error('笔记格式不符');}s.read=[...new Set(s.read.filter(n=>DATA.chapters.some(c=>c.id===n)))];s.lastChapter=DATA.chapters.some(c=>c.id===s.lastChapter)?s.lastChapter:1;s.drafts={};if(s.session){let t=s.session;if(!Array.isArray(t.ids)||!t.ids.length||new Set(t.ids).size!==t.ids.length||!t.ids.every(id=>validIds.has(id))||!Number.isFinite(t.seed)||!t.answers||typeof t.answers!=='object')throw Error('自测记录不完整');for(const[id,a]of Object.entries(t.answers)){if(!t.ids.includes(id)||!a||!Array.isArray(a.selected)||!['sure','unsure','guess'].includes(a.confidence)||!a.selected.every(k=>DATA.questions.find(q=>q.id===id).options.some(o=>o.key===k))||!a.selected.length)throw Error('自测答案无效');}t.pos=Math.max(0,Math.min(Number(t.pos)||0,t.ids.length-1));t.finished=!!t.finished;t.recorded=!!t.recorded;t.drafts={};}return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}$('#storage-status').textContent=storageOK?'本地保存':'临时使用 · 请导出备份';}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3400);}
function ask(message){return new Promise(resolve=>{const d=$('#confirm-dialog');$('#confirm-text').textContent=message;d.returnValue='';d.onclose=()=>resolve(d.returnValue==='yes');d.showModal();});}
function same(a,b){return [...new Set(a)].sort().join('')===[...new Set(b)].sort().join('');}
function latest(id){return state.attempts.filter(a=>a.id===id).at(-1);}
function review(q){const a=latest(q.id);return !!a&&(!a.correct||a.confidence!=='sure'||a.due<=now());}
function stats(list=DATA.questions){return{done:list.filter(q=>latest(q.id)).length,solid:list.filter(q=>{const a=latest(q.id);return a&&a.correct&&a.confidence==='sure';}).length,due:list.filter(review).length,total:list.length};}
function nextAttempt(q,selected,confidence){const previous=latest(q.id);const correct=same(selected,q.answer);const streak=correct&&confidence==='sure'?(previous?.streak||0)+1:0;const days=streak===0?0:streak===1?1:streak===2?3:7;return{id:q.id,selected:[...selected],confidence,correct,time:now(),streak,due:now()+days*86400000};}
function randomOrder(list,token){let n=2166136261;for(const ch of String(token)){n^=ch.charCodeAt(0);n=Math.imul(n,16777619);}const a=[...list];for(let i=a.length-1;i>0;i--){n=(Math.imul(1664525,n)+1013904223)>>>0;const j=n%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function nav(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#chapters').innerHTML=DATA.chapters.map(c=>`<button data-chapter="${c.id}" class="${chapter===c.id&&view!=='home'?'active':''}"><span class="num">${String(c.id).padStart(2,'0')}</span>${escapeHTML(c.short)}<small>${state.read.includes(c.id)?'✓':c.count}</small></button>`).join('');$('#chapters').querySelectorAll('button').forEach(b=>b.onclick=()=>{chapter=+b.dataset.chapter;state.lastChapter=chapter;save();if(view==='exam'&&state.session&&!state.session.finished){toast('自测中保持本轮题目；可切换到阅读查看章节。');view='read';}else view=view==='practice'?'practice':'read';index=0;render();});}
function go(v){view=v;if(v==='practice'){mode='all';chapter=0;index=0;}render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){nav();const content=$('#content');if(view==='home')home(content);if(view==='read')reader(content);if(view==='practice')practice(content);if(view==='exam')exam(content);nav();save();}
function home(el){const s=stats();el.innerHTML=`<section class="hero"><div class="eyebrow">A FIELD GUIDE TO PROMPT ENGINEERING</div><h1>把知识学成自己的判断。</h1><p>从一封邮件开始，理解任务、示例、推理与证据。<br>读懂之后，回到 ${s.total} 道原题，检验你能不能解释为什么。</p><div class="actions"><button class="primary" id="continue">${state.read.length?'继续读教材':'从第一章开始'}</button><button id="start">开始顺序练习</button><a href="../../../output/pdf/提示词工程_从理解到独立应用.pdf" target="_blank">阅读 PDF ↗</a></div></section><section class="stats" aria-label="学习进度"><div class="stat"><strong>${state.read.length}<small> / 11</small></strong><small>已标记读完的章节</small></div><div class="stat"><strong>${s.done}<small> / ${s.total}</small></strong><small>有本次作答记录</small></div><div class="stat"><strong>${s.solid}</strong><small>最近答对且有把握</small></div><div class="stat"><strong>${s.due}</strong><small>答错、没把握或已到期</small></div></section><div class="line-row"><h2>循序学习</h2><span class="muted">每章：理解 → 回忆 → 应用</span></div><div class="grid">${DATA.chapters.map(c=>{const st=stats(DATA.questions.filter(q=>q.chapter===c.id));return`<article class="card"><div class="eyebrow">CHAPTER ${String(c.id).padStart(2,'0')}</div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.goal)}</p><div class="progress"><i style="width:${100*st.done/st.total}%"></i></div><div class="card-foot"><span>${st.done}/${st.total} 题已练习 · ${state.read.includes(c.id)?'已读':'待读'}</span><button data-read="${c.id}">打开本章 ↗</button></div></article>`;}).join('')}</div><p class="muted">记录从此练习台开始，不推断历史成绩。“答对且有把握”仅是最近一次自评，不能证明长期掌握。建议定期导出备份。</p>`;$('#continue').onclick=()=>{chapter=state.lastChapter||1;go('read');};$('#start').onclick=()=>go('practice');el.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{chapter=+b.dataset.read;state.lastChapter=chapter;go('read');});}
function reader(el){const c=DATA.chapters.find(c=>c.id===chapter)||DATA.chapters[0];chapter=c.id;el.innerHTML=`<article class="panel reader"><div class="eyebrow">CHAPTER ${String(c.id).padStart(2,'0')} / 自学正文</div><h1>${escapeHTML(c.title)}</h1><p class="muted">${escapeHTML(c.goal)} · 对应 ${c.count} 道原题</p><div class="actions"><button id="mark-read">${state.read.includes(c.id)?'✓ 已标记读完':'标记本章读完'}</button><button id="chapter-practice" class="primary">练本章原题</button></div>${c.html}<details><summary>本章参考资料导航</summary>${DATA.references.filter(r=>c.refs.includes(r[0].slice(1))).map(r=>`<p class="muted">[${r[0]}] <a target="_blank" rel="noopener" href="${r[2]}">${escapeHTML(r[1])}</a><br>${escapeHTML(r[3])}</p>`).join('')}</details><div class="actions"><button id="prev-chapter" ${c.id===1?'disabled':''}>← 上一章</button><button id="next-chapter" ${c.id===11?'disabled':''}>下一章 →</button></div></article>`;$('#mark-read').onclick=()=>{state.read=state.read.includes(c.id)?state.read.filter(i=>i!==c.id):[...state.read,c.id];save();render();};$('#chapter-practice').onclick=()=>{view='practice';chapter=c.id;index=0;mode='all';search='';render();window.scrollTo(0,0);};$('#prev-chapter').onclick=()=>{chapter--;state.lastChapter=chapter;render();window.scrollTo(0,0);};$('#next-chapter').onclick=()=>{chapter++;state.lastChapter=chapter;render();window.scrollTo(0,0);};}
let currentPool=[];
function pool(){let p=DATA.questions.filter(q=>(!chapter||q.chapter===chapter)&&(!search||(q.stem+q.options.map(o=>o.text).join('')).toLowerCase().includes(search.toLowerCase())));if(mode==='review')p=p.filter(review);if(mode==='new')p=p.filter(q=>!latest(q.id));if(mode==='random')p=randomOrder(p,seed);return p;}
function practice(el){currentPool=pool();index=Math.max(0,Math.min(index,currentPool.length-1));el.innerHTML=`<div class="eyebrow">PRACTICE / 先独立判断，再查看依据</div><h1>练习与复习</h1><div class="toolbar"><select id="chapter-filter" aria-label="筛选章节"><option value="0">全部章节</option>${DATA.chapters.map(c=>`<option value="${c.id}" ${chapter===c.id?'selected':''}>${String(c.id).padStart(2,'0')} ${escapeHTML(c.short)}</option>`).join('')}</select><select id="mode" aria-label="练习方式">${[['all','顺序练习'],['random','随机练习'],['new','尚未作答'],['review','待复习']].map(([k,t])=>`<option value="${k}" ${mode===k?'selected':''}>${t}</option>`).join('')}</select><input id="search" type="search" aria-label="搜索题干与选项" placeholder="搜索题干或选项" value="${escapeHTML(search)}"><label><input id="shuffle" type="checkbox" ${shuffle?'checked':''}> 打乱选项位置</label></div><div id="question-slot"></div>`;$('#chapter-filter').onchange=e=>{chapter=+e.target.value;index=0;render();};$('#mode').onchange=e=>{mode=e.target.value;index=0;seed=now();render();};$('#search').oninput=e=>{search=e.target.value;index=0;currentPool=pool();showPracticeQuestion();};$('#shuffle').onchange=e=>{shuffle=e.target.checked;showPracticeQuestion();};showPracticeQuestion();}
function showPracticeQuestion(){const el=$('#question-slot');if(!currentPool.length){el.innerHTML=`<section class="panel empty"><h2>当前没有匹配的题目</h2><p>可以调整关键词、章节，或切换练习方式。<br>待复习包含答错、没把握，以及已到复习时间的题。</p><button id="all-again">查看全部原题</button></section>`;$('#all-again').onclick=()=>{chapter=0;search='';mode='all';index=0;render();};return;}const q=currentPool[index];let d=state.drafts[q.id]||(state.drafts[q.id]={selected:[],confidence:'unsure',submitted:false});questionUI(el,q,d,{pos:index,total:currentPool.length,shuffle,token:seed,onSubmit:()=>{if(!d.selected.length){toast('先选择一个答案。');return;}d.submitted=true;const a=nextAttempt(q,d.selected,d.confidence);state.attempts.push(a);d.correct=a.correct;save();showPracticeQuestion();},onPrev:()=>{index--;showPracticeQuestion();},onNext:()=>{index++;showPracticeQuestion();},onRetry:()=>{state.drafts[q.id]={selected:[],confidence:'unsure',submitted:false};showPracticeQuestion();}});}
function questionUI(el,q,d,cfg){const ordered=cfg.shuffle?randomOrder(q.options,cfg.token+q.id):q.options;const display=k=>String.fromCharCode(65+ordered.findIndex(o=>o.key===k));const letters=q.answer.map(display).sort().join('、');const isExam=!!cfg.exam;const submitted=d.submitted;const trueCorrect=same(d.selected,q.answer);el.innerHTML=`<section class="panel"><div class="badges"><span class="badge">${cfg.pos+1} / ${cfg.total}</span><span class="badge">${q.multiple?'多选题 · 选全才算对':'单选题'}</span>${isExam?'':`<span class="badge">第 ${q.chapter} 章</span><span class="badge">${q.official?'已存官方答案':'历史结论'}</span>`}<span class="spacer"></span><span class="muted">${escapeHTML(q.id)}</span></div><div class="progress"><i style="width:${(cfg.pos+1)/cfg.total*100}%"></i></div><div class="question">${escapeHTML(q.stem)}</div>${cfg.shuffle?'<p class="muted">本轮选项位置已打乱，题面与选项内容保持原文；解析同时标明原题字母。</p>':''}<form id="answer-form">${ordered.map((o,n)=>`<label class="option ${d.selected.includes(o.key)?'selected':''} ${submitted&&q.answer.includes(o.key)?'correct':''} ${submitted&&d.selected.includes(o.key)&&!q.answer.includes(o.key)?'wrong':''}"><input name="answer" type="${q.multiple?'checkbox':'radio'}" value="${o.key}" ${d.selected.includes(o.key)?'checked':''} ${submitted?'disabled':''}><span class="letter">${String.fromCharCode(65+n)}</span><span>${escapeHTML(o.text)}</span></label>`).join('')}<div class="confidence"><span>这次有多确定？</span>${[['sure','有把握'],['unsure','有点犹豫'],['guess','主要靠猜']].map(([k,t])=>`<label><input name="confidence" type="radio" value="${k}" ${d.confidence===k?'checked':''} ${submitted?'disabled':''}> ${t}</label>`).join('')}</div><label class="muted" for="reason">写一句你的理由（可选，仅保存在本机）</label><textarea id="reason" placeholder="我选择这个答案，是因为……">${escapeHTML(state.notes[q.id]||'')}</textarea><div class="actions">${submitted?'':`<button class="primary" type="submit">${isExam?'保存本题答案':'提交并核对'}</button>`}<button id="previous" type="button" ${cfg.pos===0?'disabled':''}>← 上一题</button><button id="next" type="button" ${cfg.pos===cfg.total-1?'disabled':''}>下一题 →</button>${submitted?'<button id="retry" type="button">再独立做一次</button>':''}</div></form>${submitted?`<div class="explain"><div class="result ${trueCorrect?'':'wrong'}"><strong>${trueCorrect?(d.confidence==='sure'?'这次答对了，继续解释为什么。':'这次答对了，但仍值得再回忆。'):'这次的判断需要调整。'}</strong><span>本轮答案 ${letters}；原题${q.official?'官方答案':'历史结论'} ${q.answer.join('、')}。你的选择：${d.selected.map(display).sort().join('、')||'未选择'}。</span></div>${q.note?`<div class="note"><strong>教材核对说明（非官方）</strong><br>${escapeHTML(q.note)}</div>`:''}<p class="muted">先用自己的话解释错误选项，再展开完整原记录。${trueCorrect&&d.confidence==='sure'?'已安排稍后复习；间隔为本地简易规则。':'本题仍在待复习中。'}</p><div class="actions"><button id="read-concept">回读第 ${q.chapter} 章</button></div><details><summary>查看完整原记录与已有解析</summary><p class="muted">${q.official?'以下保留已存官方答案、解析及助手说明。':'该条目保存的是历史结论和解释，没有把它标为官方解析。'}原题字母采用原始顺序。来源：${escapeHTML(q.source)} #${escapeHTML(q.anchor)}</p><div class="record">${q.record}</div></details></div>`:''}</section>`;el.querySelectorAll('input[name=answer]').forEach(input=>input.onchange=()=>{d.selected=[...el.querySelectorAll('input[name=answer]:checked')].map(i=>i.value);el.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',o.querySelector('input').checked));save();});el.querySelectorAll('input[name=confidence]').forEach(i=>i.onchange=()=>{d.confidence=i.value;save();});$('#reason').oninput=e=>{state.notes[q.id]=e.target.value.slice(0,20000);save();};$('#answer-form').onsubmit=e=>{e.preventDefault();cfg.onSubmit();};$('#previous').onclick=cfg.onPrev;$('#next').onclick=cfg.onNext;if(submitted){$('#retry').onclick=cfg.onRetry;$('#read-concept').onclick=()=>{chapter=q.chapter;state.lastChapter=chapter;go('read');};}}
function exam(el){const s=state.session;if(s?.finished){examResults(el,s);return;}if(!s){el.innerHTML=`<section class="hero"><div class="eyebrow">RECALL / 延迟反馈</div><h1>给理解做一次独立检查。</h1><p>随机抽题，打乱选项位置。逐题保存答案，在结束前不显示对错。没有倒计时，留出解释原因的空间。</p></section><section class="panel"><label for="exam-count">本轮题量</label> <select id="exam-count"><option value="10">10 题</option><option value="20">20 题</option><option value="${DATA.questions.length}">全部 ${DATA.questions.length} 题</option></select><div class="actions"><button id="begin-exam" class="primary">开始自测</button></div><p class="muted">自测中可以切换页面，已保存答案保留在本机。未交卷前不计入练习统计。只有点击“保存本题答案”后才计入本轮作答。</p></section>`;$('#begin-exam').onclick=()=>{const token=now();state.session={ids:randomOrder(DATA.questions,token).slice(0,+$('#exam-count').value).map(q=>q.id),seed:token,answers:{},drafts:{},pos:0,finished:false,recorded:false};save();render();};return;}s.drafts=s.drafts||{};const q=DATA.questions.find(q=>q.id===s.ids[s.pos]);const draft=s.drafts[q.id]||(s.drafts[q.id]=structuredClone(s.answers[q.id]||{selected:[],confidence:'unsure',submitted:false}));el.innerHTML=`<div class="eyebrow">SELF CHECK / 本轮暂不揭晓答案</div><h1>自测一轮</h1><div class="toolbar"><span class="muted">已保存 ${Object.keys(s.answers).length} / ${s.ids.length} 题</span><span class="spacer"></span><button id="finish-exam">结束并核对</button><button id="cancel-exam">放弃本轮</button></div><div class="exam-grid">${s.ids.map((id,n)=>`<button data-pos="${n}" class="${s.answers[id]?'done':''} ${s.pos===n?'current':''}" aria-label="第${n+1}题">${n+1}</button>`).join('')}</div><div id="exam-question"></div>`;questionUI($('#exam-question'),q,draft,{pos:s.pos,total:s.ids.length,shuffle:true,token:s.seed,exam:true,onSubmit:()=>{if(!draft.selected.length){toast('先选择答案。');return;}s.answers[q.id]={selected:[...draft.selected],confidence:draft.confidence};save();toast('本题答案已保存，可修改后再次保存。');if(s.pos<s.ids.length-1)s.pos++;render();},onPrev:()=>{s.pos--;save();render();},onNext:()=>{s.pos++;save();render();}});el.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{s.pos=+b.dataset.pos;save();render();});$('#cancel-exam').onclick=async()=>{if(await ask('放弃这轮尚未交卷的自测？平时练习记录不会删除。')){state.session=null;save();render();}};$('#finish-exam').onclick=async()=>{const missing=s.ids.filter(id=>!s.answers[id]);if(missing.length&&!(await ask(`还有 ${missing.length} 题未保存，仍结束？未保存题按本轮未作答显示，不写入错题记录。`)))return;s.finished=true;if(!s.recorded){for(const id of s.ids){if(s.answers[id])state.attempts.push(nextAttempt(DATA.questions.find(q=>q.id===id),s.answers[id].selected,s.answers[id].confidence));}s.recorded=true;}save();render();window.scrollTo(0,0);};}
function examResults(el,s){const answered=s.ids.filter(id=>s.answers[id]);const right=answered.filter(id=>same(s.answers[id].selected,DATA.questions.find(q=>q.id===id).answer));el.innerHTML=`<section class="hero"><div class="eyebrow">REFLECT / 本轮学习回顾</div><h1>${right.length} / ${s.ids.length} 题判断正确</h1><p>已作答 ${answered.length} 题，未作答 ${s.ids.length-answered.length} 题。已作答正确率 ${answered.length?Math.round(100*right.length/answered.length):0}%。<br>答错和没把握的题已进入待复习；未作答不推断为知识性错误。</p><div class="actions"><button class="primary" id="review-now">去待复习</button><button id="new-exam">结束本轮回顾</button></div></section><section class="panel">${s.ids.map((id,n)=>{const q=DATA.questions.find(q=>q.id===id),a=s.answers[id];return`<details><summary>${n+1}. ${a?(same(a.selected,q.answer)?'✓':'需复习'):'未作答'} · ${escapeHTML(q.stem)}</summary><p>原题${q.official?'官方答案':'历史结论'}：${q.answer.join('、')}；本轮选择对应原题字母：${a?a.selected.join('、'):'未作答'}。</p>${q.note?`<div class="note">教材核对说明：${escapeHTML(q.note)}</div>`:''}<div class="record">${q.record}</div></details>`;}).join('')}</section>`;$('#review-now').onclick=()=>{mode='review';chapter=0;view='practice';index=0;render();};$('#new-exam').onclick=()=>{state.session=null;save();render();};}
function exportState(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='提示词工程_学习记录_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出。换浏览器或设备前请保留这份文件。');}
$('#export').onclick=exportState;$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('文件过大');const next=validate(JSON.parse(await f.text()));if(await ask('导入会替换本机学习记录。建议先导出当前记录；确认替换？')){state=next;chapter=state.lastChapter;index=0;save();render();toast('学习记录已导入。');}}catch(err){toast('无法导入：'+err.message);}e.target.value='';};$('#clear').onclick=async()=>{if(await ask('清空此浏览器的全部学习记录？这不会改动仓库原题。建议先导出备份。')){state={schema:1,attempts:[],drafts:{},notes:{},read:[],lastChapter:1,session:null};save();view='home';render();}};$('#help').onclick=()=>{toast('使用说明已展开在页面末尾。');$('#message').innerHTML='<p>先读教材并回答回忆线索，再做原题。练习立即反馈，自测交卷后反馈。打乱选项会重新标本轮字母，原记录保留原题字母。复习间隔：答错或犹豫立即保留，有把握答对后依次为1、3、7天；这是简易学习辅助规则。数据仅在当前浏览器，建议导出后再换设备。隐私模式或存储被禁用时请及时导出。原题来自现有历史记录，来源标签区分已存官方解析与历史结论。手机可以复制整个交付包，用支持本地HTML的浏览器或本地HTTP服务访问；不同设备数据用JSON手动转移。</p>';};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));render();
</script></body></html>
