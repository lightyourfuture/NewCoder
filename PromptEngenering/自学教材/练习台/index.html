thon 编写一个归并排序函数，要求：有类型注释、有边界处理、有注释说明每个步骤\""}, {"key": "C", "text": "\"告诉我怎么排序\""}, {"key": "D", "text": "\"排序算法有哪些？\""}], "answer": ["B"], "multiple": false, "official": false, "chapter": 1, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-017", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种提示词写法更容易得到高质量的代码输出？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. \"写一个排序函数\"\u003c/li\u003e\n\u003cli\u003eB. \"用 Python 编写一个归并排序函数，要求：有类型注释、有边界处理、有注释说明每个步骤\"\u003c/li\u003e\n\u003cli\u003eC. \"告诉我怎么排序\"\u003c/li\u003e\n\u003cli\u003eD. \"排序算法有哪些？\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 高质量代码输出需要明确任务细节。B 指定了编程语言、算法类型、代码质量要求、边界处理和注释要求，模型知道要交付什么样的代码。A 太宽泛，C 和 D 更像解释或科普，不是明确的代码生成任务。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e代码生成提示越具体，越容易得到符合要求的结果。\u003c/li\u003e\n\u003cli\u003e只说“写一个函数”容易导致模型自行假设语言、算法、输入输出和质量标准。\u003c/li\u003e\n\u003cli\u003e询问概念类问题不等于要求产出可用代码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e高质量代码 Prompt = 明确语言 + 目标算法/功能 + 输入输出 + 边界处理 + 代码风格/注释要求。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-018", "title": "2026-05-22 提示词中使用分隔符的主要目的", "stem": "在提示词中使用分隔符（如 ```、### 或 \u003ctag\u003e）的主要目的是什么？", "options": [{"key": "A", "text": "增加提示的美观性"}, {"key": "B", "text": "清晰区分提示的不同部分，防止内容混淆和注入"}, {"key": "C", "text": "减少 token 消耗"}, {"key": "D", "text": "帮助模型进行推理"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 10, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-018", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在提示词中使用分隔符（如 ```、### 或 \u003ctag\u003e）的主要目的是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 增加提示的美观性\u003c/li\u003e\n\u003cli\u003eB. 清晰区分提示的不同部分，防止内容混淆和注入\u003c/li\u003e\n\u003cli\u003eC. 减少 token 消耗\u003c/li\u003e\n\u003cli\u003eD. 帮助模型进行推理\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 分隔符的作用是把 Prompt 的不同区域分清楚，比如哪里是任务指令，哪里是用户输入，哪里是参考资料，哪里是示例。这样模型更不容易把用户输入误当成指令，也能降低提示注入风险。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e分隔符不是为了美观，而是为了结构清晰。\u003c/li\u003e\n\u003cli\u003e分隔符本身会占 token，不是减少 token 消耗。\u003c/li\u003e\n\u003cli\u003e它可能间接让任务更清楚，但主要目的不是推理，而是区分内容边界。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e分隔符 = 给 Prompt 划清边界，区分指令、数据、示例和上下文，减少混淆与注入风险。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "分隔符能减少混淆，不能单独防止提示注入；真正权限检查必须在模型之外落实。", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-019", "title": "2026-05-22 Prompt 优化中的 Token 优化目标", "stem": "以下哪项是 Prompt 优化的\"Token 优化\"技术的目标？", "options": [{"key": "A", "text": "增加输出的 token 数量以提升质量"}, {"key": "B", "text": "在保持效果的前提下，减少输入输出的 token 消耗，降低成本"}, {"key": "C", "text": "让模型使用更专业的词汇"}, {"key": "D", "text": "避免模型使用停用词"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 4, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-019", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪项是 Prompt 优化的\"Token 优化\"技术的目标？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 增加输出的 token 数量以提升质量\u003c/li\u003e\n\u003cli\u003eB. 在保持效果的前提下，减少输入输出的 token 消耗，降低成本\u003c/li\u003e\n\u003cli\u003eC. 让模型使用更专业的词汇\u003c/li\u003e\n\u003cli\u003eD. 避免模型使用停用词\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Token 优化的目标是在效果基本不变的情况下，让 Prompt 和输出更精简。这样可以减少 API 成本、降低延迟，也能节省上下文窗口空间。重点不是一味变短，而是在不损失关键效果的前提下减少冗余。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e增加 token 通常会增加成本，不是 token 优化的目标。\u003c/li\u003e\n\u003cli\u003e使用专业词汇属于表达风格问题，不是 token 优化核心。\u003c/li\u003e\n\u003cli\u003e停用词是传统 NLP 中常见概念，Prompt 优化不是简单删除停用词。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eToken 优化 = 保持效果的前提下减少输入和输出 token，降低成本和延迟。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-020", "title": "2026-05-22 Few-shot 示例的选择原则", "stem": "在 Few-shot 示例的选择上，哪种做法最佳？", "options": [{"key": "A", "text": "选择最简单的示例，降低难度"}, {"key": "B", "text": "选择能覆盖多样情况、与实际任务分布相近的示例"}, {"key": "C", "text": "示例越多越好"}, {"key": "D", "text": "只选择正确答案的示例，不包含错误示例"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-020", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在 Few-shot 示例的选择上，哪种做法最佳？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 选择最简单的示例，降低难度\u003c/li\u003e\n\u003cli\u003eB. 选择能覆盖多样情况、与实际任务分布相近的示例\u003c/li\u003e\n\u003cli\u003eC. 示例越多越好\u003c/li\u003e\n\u003cli\u003eD. 只选择正确答案的示例，不包含错误示例\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Few-shot 示例是给模型看的“参考样板”。好的示例应该覆盖实际任务里常见的不同情况，包括简单情况、边界情况、容易混淆的情况，并且要和真实输入分布接近。这样模型学到的模式才更适用于真实任务。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e只选最简单的示例，模型遇到复杂或边界情况时容易处理不好。\u003c/li\u003e\n\u003cli\u003e示例不是越多越好，太多会增加 token 成本，也可能引入噪声。\u003c/li\u003e\n\u003cli\u003e是否包含错误示例要看任务设计。如果任务需要模型识别错误、纠错或学习反例，错误示例也可能有价值；关键是示例要清楚标注。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFew-shot 示例选择 = 覆盖多样情况 + 贴近真实任务分布 + 控制数量和质量。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-021", "title": "2026-05-22 处理敏感信息文档时的首要考虑", "stem": "当需要模型处理包含敏感信息（如个人身份信息）的文档时，Prompt 工程师应该首先考虑什么？", "options": [{"key": "A", "text": "增加输出长度限制"}, {"key": "B", "text": "在 Prompt 中和系统设计上明确数据脱敏策略，避免敏感信息被记录或泄露"}, {"key": "C", "text": "使用更高的 Temperature"}, {"key": "D", "text": "减少 Few-shot 示例"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 10, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-021", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e当需要模型处理包含敏感信息（如个人身份信息）的文档时，Prompt 工程师应该首先考虑什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 增加输出长度限制\u003c/li\u003e\n\u003cli\u003eB. 在 Prompt 中和系统设计上明确数据脱敏策略，避免敏感信息被记录或泄露\u003c/li\u003e\n\u003cli\u003eC. 使用更高的 Temperature\u003c/li\u003e\n\u003cli\u003eD. 减少 Few-shot 示例\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 处理个人身份信息、隐私数据、商业机密这类敏感内容时，首先要考虑安全和隐私。Prompt 和系统设计都应该明确哪些字段要脱敏、哪些信息不能输出、是否允许记录日志、如何最小化暴露范围。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e输出长度限制不能解决敏感信息泄露问题。\u003c/li\u003e\n\u003cli\u003eTemperature 控制随机性，和隐私保护没有直接关系。\u003c/li\u003e\n\u003cli\u003e减少 Few-shot 示例可能减少上下文内容，但不是敏感数据处理的核心策略。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e处理敏感信息：优先考虑脱敏、最小化暴露、日志保护和防泄露策略。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-022", "title": "2026-05-22 Grounding 在提示词工程中的含义", "stem": "\"Grounding\"（接地）技术在提示词工程中是指什么？", "options": [{"key": "A", "text": "将模型输出限定在特定格式"}, {"key": "B", "text": "将模型的回答锚定在提供的事实依据（如文档、数据库）上，减少凭空捏造"}, {"key": "C", "text": "为模型设定角色身份"}, {"key": "D", "text": "要求模型使用简单语言"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 7, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-022", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Grounding\"（接地）技术在提示词工程中是指什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 将模型输出限定在特定格式\u003c/li\u003e\n\u003cli\u003eB. 将模型的回答锚定在提供的事实依据（如文档、数据库）上，减少凭空捏造\u003c/li\u003e\n\u003cli\u003eC. 为模型设定角色身份\u003c/li\u003e\n\u003cli\u003eD. 要求模型使用简单语言\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Grounding 就是让模型回答时必须基于给定事实，比如文档、数据库、检索结果、知识库内容，而不是凭自己的感觉编。它的核心目标是让回答有依据，减少幻觉。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e限定格式是结构化输出，不是 Grounding。\u003c/li\u003e\n\u003cli\u003e设定角色是角色提示，不是 Grounding。\u003c/li\u003e\n\u003cli\u003e使用简单语言是风格要求，不是事实依据约束。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGrounding = 把回答锚定在事实依据上，如文档、数据库、检索结果，以减少幻觉。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-023", "title": "2026-05-22 非 Prompt 优化常见技术的识别", "stem": "以下哪项不是优化 Prompt 的常见技术？", "options": [{"key": "A", "text": "指令精炼"}, {"key": "B", "text": "增加模型参数量"}, {"key": "C", "text": "约束收紧"}, {"key": "D", "text": "示例校准"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-023", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪项不是优化 Prompt 的常见技术？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 指令精炼\u003c/li\u003e\n\u003cli\u003eB. 增加模型参数量\u003c/li\u003e\n\u003cli\u003eC. 约束收紧\u003c/li\u003e\n\u003cli\u003eD. 示例校准\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Prompt 优化是在不改模型本身的前提下，通过改写提示词来改善效果。指令精炼、约束收紧、示例校准都属于改 Prompt；增加模型参数量属于换模型或训练模型层面的事情，不是 Prompt 优化技术。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e模型更大可能效果更好，但那是模型能力变化，不是 Prompt 优化。\u003c/li\u003e\n\u003cli\u003ePrompt 优化主要改的是输入指令、格式、约束、示例和上下文组织方式。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 优化改提示词；增加模型参数量改的是模型本身，不属于 Prompt 优化。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-024", "title": "2026-05-22 Iterative refinement 提示策略", "stem": "\"Iterative refinement\"（迭代精炼）提示策略是指什么？", "options": [{"key": "A", "text": "多次调用模型，每次基于上一次的输出进行改进"}, {"key": "B", "text": "逐渐增加 Few-shot 示例数量"}, {"key": "C", "text": "反复修改 System Prompt 直到满意"}, {"key": "D", "text": "对模型进行多轮微调"}], "answer": ["A"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-024", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Iterative refinement\"（迭代精炼）提示策略是指什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 多次调用模型，每次基于上一次的输出进行改进\u003c/li\u003e\n\u003cli\u003eB. 逐渐增加 Few-shot 示例数量\u003c/li\u003e\n\u003cli\u003eC. 反复修改 System Prompt 直到满意\u003c/li\u003e\n\u003cli\u003eD. 对模型进行多轮微调\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：A\u003c/p\u003e\n\u003cp\u003e大白话解析： 迭代精炼就是先让模型产出一个初版，然后基于这个初版继续修改、补充、纠错、压缩或优化，经过多轮得到更好的结果。它强调“上一轮输出作为下一轮改进的基础”。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e增加 Few-shot 示例数量可能是 Prompt 调整方式，但不是迭代精炼的定义。\u003c/li\u003e\n\u003cli\u003e修改 System Prompt 可能影响模型行为，但迭代精炼主要是围绕输出结果多轮改进。\u003c/li\u003e\n\u003cli\u003e微调会更新模型参数，不属于提示策略。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIterative refinement = 初版输出 -\u0026gt; 基于反馈改进 -\u0026gt; 多轮精炼得到更好结果。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-025", "title": "2026-05-22 Soft prompt 与普通 Prompt 的本质区别", "stem": "\"Soft prompt\"（软提示）与普通 Prompt 的本质区别是什么？", "options": [{"key": "A", "text": "Soft prompt 使用更简单的语言"}, {"key": "B", "text": "Soft prompt 是可训练的连续向量，不是人类可读的文本，通过梯度优化得到"}, {"key": "C", "text": "Soft prompt 不包含任何指令"}, {"key": "D", "text": "Soft prompt 只用于图像生成"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-025", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Soft prompt\"（软提示）与普通 Prompt 的本质区别是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. Soft prompt 使用更简单的语言\u003c/li\u003e\n\u003cli\u003eB. Soft prompt 是可训练的连续向量，不是人类可读的文本，通过梯度优化得到\u003c/li\u003e\n\u003cli\u003eC. Soft prompt 不包含任何指令\u003c/li\u003e\n\u003cli\u003eD. Soft prompt 只用于图像生成\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 普通 Prompt 是人能读懂的文字，比如“请总结下面文本”。Soft prompt 不是自然语言文本，而是一组可训练的向量，像是给模型输入前加上的“隐形提示”。这些向量通过训练优化得到，人通常看不懂它具体表示什么。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSoft prompt 不是更简单的语言，而是非文本的连续向量。\u003c/li\u003e\n\u003cli\u003e它可以起到指令或任务引导作用，只是指令不是用人类语言写出来的。\u003c/li\u003e\n\u003cli\u003eSoft prompt 主要用于 NLP/大模型参数高效调优等场景，不是只用于图像生成。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSoft prompt = 可训练的连续向量提示；普通 Prompt = 人类可读文本提示。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-026", "title": "2026-05-22 Program of Thoughts 的定义", "stem": "以下哪种技术被称为\"思维程序提示\"（Program of Thoughts, PoT）？", "options": [{"key": "A", "text": "让模型描述解题思路的文字步骤"}, {"key": "B", "text": "让模型生成可执行的代码来解决数学或逻辑问题，而非用自然语言推理"}, {"key": "C", "text": "为模型提供解题程序模板"}, {"key": "D", "text": "要求模型按固定格式输出推理步骤"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 6, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-026", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种技术被称为\"思维程序提示\"（Program of Thoughts, PoT）？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 让模型描述解题思路的文字步骤\u003c/li\u003e\n\u003cli\u003eB. 让模型生成可执行的代码来解决数学或逻辑问题，而非用自然语言推理\u003c/li\u003e\n\u003cli\u003eC. 为模型提供解题程序模板\u003c/li\u003e\n\u003cli\u003eD. 要求模型按固定格式输出推理步骤\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： PoT 的核心是让模型把问题转成可以执行的程序，比如 Python 代码，然后通过运行或推导代码得到答案。它和 CoT 不同，CoT 主要是自然语言一步步推理，PoT 更强调用程序计算来减少人工推理和算术错误。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 更像 Chain-of-Thought，不是 Program of Thoughts。\u003c/li\u003e\n\u003cli\u003e提供程序模板可能辅助 PoT，但不是 PoT 的本质定义。\u003c/li\u003e\n\u003cli\u003e固定格式输出推理步骤仍是自然语言或结构化推理，不等于生成可执行代码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePoT = 让模型生成可执行代码解决数学/逻辑问题；CoT = 用自然语言写推理步骤。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-027", "title": "2026-05-22 Few-shot 示例效果的影响因素", "stem": "以下哪个因素对 Few-shot 示例的效果影响最大？", "options": [{"key": "A", "text": "示例的排列顺序（最后一个示例影响最大）"}, {"key": "B", "text": "示例的总数量"}, {"key": "C", "text": "示例中使用的语言（中文还是英文）"}, {"key": "D", "text": "示例的字数长短"}], "answer": ["A"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-027", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪个因素对 Few-shot 示例的效果影响最大？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 示例的排列顺序（最后一个示例影响最大）\u003c/li\u003e\n\u003cli\u003eB. 示例的总数量\u003c/li\u003e\n\u003cli\u003eC. 示例中使用的语言（中文还是英文）\u003c/li\u003e\n\u003cli\u003eD. 示例的字数长短\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：A\u003c/p\u003e\n\u003cp\u003e大白话解析： Few-shot 示例不是随便堆几个例子就行，示例顺序会影响模型模仿哪个模式。尤其是靠近待回答问题的最后一个示例，模型更容易把它当作最近的参考样板。因此示例排列顺序可能明显影响输出效果。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e真实项目里，示例质量、覆盖范围、与任务分布的相似度通常也非常关键；这道题的选项里没有直接给出这些因素。\u003c/li\u003e\n\u003cli\u003e示例数量不是越多越好，过多会增加 token 成本，也可能引入噪声。\u003c/li\u003e\n\u003cli\u003e示例语言和字数会有影响，但通常不是这组选项里最核心的因素。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFew-shot 对示例顺序敏感，靠近问题的示例往往影响更大；但实际优化还要优先关注示例质量和分布。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "保留历史答案 A；顺序确实可能影响结果，但无通用证据支持它永远影响最大或最后一个永远最强。作为有表述争议的题复习。", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-028", "title": "2026-05-22 Metacognitive prompting 的含义", "stem": "\"Metacognitive prompting\"（元认知提示）是什么技术？", "options": [{"key": "A", "text": "要求模型自我评估输出质量，并在必要时修正"}, {"key": "B", "text": "让模型思考自己的思考过程"}, {"key": "C", "text": "让模型列出解题所用的知识来源"}, {"key": "D", "text": "以上都是"}], "answer": ["D"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-028", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Metacognitive prompting\"（元认知提示）是什么技术？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 要求模型自我评估输出质量，并在必要时修正\u003c/li\u003e\n\u003cli\u003eB. 让模型思考自己的思考过程\u003c/li\u003e\n\u003cli\u003eC. 让模型列出解题所用的知识来源\u003c/li\u003e\n\u003cli\u003eD. 以上都是\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：D\u003c/p\u003e\n\u003cp\u003e大白话解析： 元认知提示就是让模型不只是直接回答，还要“检查自己是怎么想的、答案靠不靠谱、依据是什么、是否需要修正”。它强调模型对自身推理和输出进行监控、评估和调整。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 是元认知提示的典型做法：自我评估和修正。\u003c/li\u003e\n\u003cli\u003eB 是元认知的核心含义：思考自己的思考过程。\u003c/li\u003e\n\u003cli\u003eC 也可以作为元认知提示的一部分：让模型说明依据来源，帮助判断回答是否可靠。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMetacognitive prompting = 让模型自我反思、自我评估、说明依据，并在必要时修正输出。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "自我评估和来源说明只是辅助信号；不能据此取得真实内部过程、可靠训练来源或经验证的置信度。", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-029", "title": "2026-05-22 Let's think step by step 触发的提示技术", "stem": "\"Let's think step by step\" 这句话通常用于触发哪种提示技术？", "options": [{"key": "A", "text": "Role prompting"}, {"key": "B", "text": "Few-shot prompting"}, {"key": "C", "text": "Zero-shot Chain-of-Thought"}, {"key": "D", "text": "Self-consistency"}], "answer": ["C"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-029", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Let's think step by step\" 这句话通常用于触发哪种提示技术？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. Role prompting\u003c/li\u003e\n\u003cli\u003eB. Few-shot prompting\u003c/li\u003e\n\u003cli\u003eC. Zero-shot Chain-of-Thought\u003c/li\u003e\n\u003cli\u003eD. Self-consistency\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：C\u003c/p\u003e\n\u003cp\u003e大白话解析： \"Let's think step by step\" 的意思是“让我们一步一步思考”。它不提供示例，只是在零样本情况下引导模型展开中间推理步骤，因此通常被称为 Zero-shot Chain-of-Thought。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRole prompting 是设定角色，比如“你是数学老师”。\u003c/li\u003e\n\u003cli\u003eFew-shot prompting 需要给示例；这句话本身没有示例。\u003c/li\u003e\n\u003cli\u003eSelf-consistency 是采样多个推理路径再投票或选择一致答案，不是这句话本身。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Let's think step by step\" = Zero-shot CoT 的经典触发语。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "01-030", "title": "2026-05-22 Temperature 和 Top-p 的关系", "stem": "以下哪种说法关于 Temperature 和 Top-p 是正确的？", "options": [{"key": "A", "text": "Temperature 控制词汇多样性，Top-p 控制输出长度"}, {"key": "B", "text": "两者都可以控制输出的随机性，实践中通常只调整其中一个"}, {"key": "C", "text": "Temperature 只影响代码生成，Top-p 只影响文本生成"}, {"key": "D", "text": "两者应该始终同时设置为最大值"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 4, "source": "PromptEngenering/题目/历史题目_01.md", "anchor": "s-01-030", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种说法关于 Temperature 和 Top-p 是正确的？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. Temperature 控制词汇多样性，Top-p 控制输出长度\u003c/li\u003e\n\u003cli\u003eB. 两者都可以控制输出的随机性，实践中通常只调整其中一个\u003c/li\u003e\n\u003cli\u003eC. Temperature 只影响代码生成，Top-p 只影响文本生成\u003c/li\u003e\n\u003cli\u003eD. 两者应该始终同时设置为最大值\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Temperature 和 Top-p 都会影响模型生成时的随机性和多样性。Temperature 调整概率分布的“平滑程度”，Top-p 限制模型只在累计概率达到一定范围的候选词里采样。实践中通常优先调一个，避免两个参数同时变化导致效果难判断。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTop-p 不控制输出长度，输出长度通常由 max tokens 等参数控制。\u003c/li\u003e\n\u003cli\u003eTemperature 和 Top-p 都可用于代码和文本生成，不是一个只管代码、一个只管文本。\u003c/li\u003e\n\u003cli\u003e同时设置为最大值通常会让输出更发散，不适合稳定任务。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTemperature 和 Top-p 都控制生成随机性；实践中通常只重点调整其中一个。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "0f665ca1e834c9ce7270fc1a0bb7f0a252679cbb78627c0c96bc367c8bdf988d"}, {"id": "02-001", "title": "2026-05-23 Output scaffolding 的含义", "stem": "\"Output scaffolding\"（输出脚手架）技术是指什么？", "options": [{"key": "A", "text": "让模型生成代码框架"}, {"key": "B", "text": "在 Prompt 中提供输出的部分结构或开头，引导模型按特定格式完成"}, {"key": "C", "text": "使用外部工具验证模型输出"}, {"key": "D", "text": "要求模型输出多种格式"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 3, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-001", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Output scaffolding\"（输出脚手架）技术是指什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 让模型生成代码框架\u003c/li\u003e\n\u003cli\u003eB. 在 Prompt 中提供输出的部分结构或开头，引导模型按特定格式完成\u003c/li\u003e\n\u003cli\u003eC. 使用外部工具验证模型输出\u003c/li\u003e\n\u003cli\u003eD. 要求模型输出多种格式\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Output scaffolding 就是先在 Prompt 里给模型一个输出“骨架”或开头，让模型照着这个结构继续补全。它的重点不是让模型写代码框架，而是控制模型的回答格式、字段顺序和组织方式。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 容易被“scaffolding”这个词误导，以为是代码脚手架；这里说的是输出结构脚手架。\u003c/li\u003e\n\u003cli\u003eC 是输出验证，不是输出脚手架。\u003c/li\u003e\n\u003cli\u003eD 是多格式输出要求，不是提供部分结构来引导补全。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOutput scaffolding = 在 Prompt 中预先给出输出结构/开头，让模型按指定格式补全。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-002", "title": "2026-05-23 评估提示词工程效果的可靠方法", "stem": "以下哪个是评估提示词工程效果的最可靠方法？", "options": [{"key": "A", "text": "只看几个主观感觉良好的示例"}, {"key": "B", "text": "建立包含多样用例的评测集，通过量化指标（如准确率、格式合规率）进行系统性评估"}, {"key": "C", "text": "只测试最困难的边界用例"}, {"key": "D", "text": "依赖单次运行的结果判断"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-002", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪个是评估提示词工程效果的最可靠方法？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 只看几个主观感觉良好的示例\u003c/li\u003e\n\u003cli\u003eB. 建立包含多样用例的评测集，通过量化指标（如准确率、格式合规率）进行系统性评估\u003c/li\u003e\n\u003cli\u003eC. 只测试最困难的边界用例\u003c/li\u003e\n\u003cli\u003eD. 依赖单次运行的结果判断\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 评估 Prompt 不能只凭感觉，也不能只看一两次输出。可靠做法是准备一批覆盖不同情况的测试样例，然后用明确指标衡量效果，比如答案准确率、格式合规率、拒答率、幻觉率、稳定性等。这样才能知道 Prompt 是真的变好了，还是刚好某个例子表现不错。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e主观感觉容易偏，几个好例子不能代表整体效果。\u003c/li\u003e\n\u003cli\u003e只测困难边界用例会忽略普通场景表现。\u003c/li\u003e\n\u003cli\u003e单次运行不可靠，模型输出有随机性。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 评估要用多样评测集 + 量化指标 + 系统性对比。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-003", "title": "2026-05-23 提升 Prompt 对分布外输入鲁棒性的方法", "stem": "以下哪种做法最有助于提升 Prompt 对\"分布外\"（Out-of-Distribution）输入的鲁棒性？", "options": [{"key": "A", "text": "只在典型样本上测试 Prompt"}, {"key": "B", "text": "在测试集中纳入边界用例和对抗样本，并在 Prompt 中加入对异常输入的处理指令（如\"若输入不符合预期格式，请说明原因并请求澄清\"）"}, {"key": "C", "text": "增加 Temperature 参数"}, {"key": "D", "text": "减少 System Prompt 的长度"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-003", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种做法最有助于提升 Prompt 对\"分布外\"（Out-of-Distribution）输入的鲁棒性？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 只在典型样本上测试 Prompt\u003c/li\u003e\n\u003cli\u003eB. 在测试集中纳入边界用例和对抗样本，并在 Prompt 中加入对异常输入的处理指令（如\"若输入不符合预期格式，请说明原因并请求澄清\"）\u003c/li\u003e\n\u003cli\u003eC. 增加 Temperature 参数\u003c/li\u003e\n\u003cli\u003eD. 减少 System Prompt 的长度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 分布外输入就是和正常输入不太一样、超出预期范围的输入，比如格式错乱、信息缺失、恶意诱导、极端边界情况。要提升鲁棒性，需要先用这些情况测试 Prompt，再在 Prompt 里写清楚异常输入怎么处理，比如说明原因、拒绝处理、请求澄清或输出固定错误格式。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e只测典型样本无法发现异常输入下的问题。\u003c/li\u003e\n\u003cli\u003e增加 Temperature 会提高随机性，通常不利于稳定处理异常输入。\u003c/li\u003e\n\u003cli\u003eSystem Prompt 不是越短越好，关键是是否包含必要的边界和异常处理规则。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e提升 OOD 鲁棒性 = 测边界/对抗样本 + 明确异常输入处理策略。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-004", "title": "2026-05-23 Prompt 版本控制的最佳实践", "stem": "以下哪种说法正确描述了\"Prompt 版本控制\"的最佳实践？", "options": [{"key": "A", "text": "只保存最新版本的 Prompt，删除历史版本"}, {"key": "B", "text": "将 Prompt 存储在代码仓库中，每次修改创建新版本，记录修改原因和效果变化"}, {"key": "C", "text": "将 Prompt 硬编码在业务逻辑中，避免频繁修改"}, {"key": "D", "text": "只在本地保存 Prompt，不需要版本控制"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-004", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种说法正确描述了\"Prompt 版本控制\"的最佳实践？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 只保存最新版本的 Prompt，删除历史版本\u003c/li\u003e\n\u003cli\u003eB. 将 Prompt 存储在代码仓库中，每次修改创建新版本，记录修改原因和效果变化\u003c/li\u003e\n\u003cli\u003eC. 将 Prompt 硬编码在业务逻辑中，避免频繁修改\u003c/li\u003e\n\u003cli\u003eD. 只在本地保存 Prompt，不需要版本控制\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Prompt 在实际项目里应该像代码和配置一样管理。每次改 Prompt，都应该能追踪改了什么、为什么改、效果有没有变好。如果新版本出问题，也能回滚到旧版本。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e只保存最新版本会丢失历史记录，难以排查问题和回滚。\u003c/li\u003e\n\u003cli\u003e硬编码在业务逻辑里会增加维护成本，也不方便实验和版本对比。\u003c/li\u003e\n\u003cli\u003e只保存在本地不利于团队协作、审查和复现。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 版本控制 = 存仓库 + 记录变更原因 + 评估效果变化 + 支持回滚。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-005", "title": "2026-05-23 Prompt 具体性原则", "stem": "在设计 Prompt 时，\"具体性\"（Specificity）原则要求什么？", "options": [{"key": "A", "text": "使用尽量多的专业术语"}, {"key": "B", "text": "用精确、可量化的语言描述任务要求，避免模糊词汇"}, {"key": "C", "text": "提供尽量长的背景信息"}, {"key": "D", "text": "要求模型输出尽量详细的内容"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 1, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-005", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在设计 Prompt 时，\"具体性\"（Specificity）原则要求什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 使用尽量多的专业术语\u003c/li\u003e\n\u003cli\u003eB. 用精确、可量化的语言描述任务要求，避免模糊词汇\u003c/li\u003e\n\u003cli\u003eC. 提供尽量长的背景信息\u003c/li\u003e\n\u003cli\u003eD. 要求模型输出尽量详细的内容\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 具体性原则要求把任务说清楚，最好能量化、能检查。比如不要说“简单回答一下”，而是说“用不超过 3 句话回答”；不要说“分析得详细一点”，而是说“从成本、风险、收益三个角度各给 1 条要点”。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e专业术语多不等于具体，反而可能增加理解成本。\u003c/li\u003e\n\u003cli\u003e背景信息长不等于有效，关键是和任务相关。\u003c/li\u003e\n\u003cli\u003e输出详细不等于具体，具体性强调明确标准和可执行约束。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSpecificity = 用明确、精确、可量化、可检查的语言描述任务和输出要求。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-006", "title": "2026-05-23 Prompt Drift 的含义", "stem": "\"Prompt 漂移\"（Prompt Drift）是指什么现象？", "options": [{"key": "A", "text": "模型在长对话中逐渐偏离最初的 System Prompt 约束"}, {"key": "B", "text": "Prompt 的长度随时间增加"}, {"key": "C", "text": "模型输出的格式发生变化"}, {"key": "D", "text": "用户不断修改 Prompt"}], "answer": ["A"], "multiple": false, "official": false, "chapter": 8, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-006", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Prompt 漂移\"（Prompt Drift）是指什么现象？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 模型在长对话中逐渐偏离最初的 System Prompt 约束\u003c/li\u003e\n\u003cli\u003eB. Prompt 的长度随时间增加\u003c/li\u003e\n\u003cli\u003eC. 模型输出的格式发生变化\u003c/li\u003e\n\u003cli\u003eD. 用户不断修改 Prompt\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：A\u003c/p\u003e\n\u003cp\u003e大白话解析： Prompt Drift 指的是对话变长后，模型可能逐渐忘记或弱化最初的规则，回答开始偏离原本的角色、格式、边界或行为规范。比如一开始要求“只输出 JSON”，聊了很多轮后模型又开始输出解释文本，这可能就是漂移表现。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 变长不是 Prompt Drift 的定义，只可能是长对话环境中的相关因素。\u003c/li\u003e\n\u003cli\u003e输出格式变化可能是 Prompt Drift 的表现，但定义更广，包括角色、约束、行为边界的偏离。\u003c/li\u003e\n\u003cli\u003e用户修改 Prompt 是主动变更，不等于模型自己在长对话中漂移。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt Drift = 长对话中模型逐渐偏离最初提示约束、角色或输出规范。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-007", "title": "2026-05-23 Pydantic 在结构化输出中的作用", "stem": "Pydantic 在结构化输出中的作用是什么？", "options": [{"key": "A", "text": "提高模型的推理速度"}, {"key": "B", "text": "定义数据模型的 Schema，用于验证和题目解析模型的结构化输出"}, {"key": "C", "text": "生成更多样化的文本"}, {"key": "D", "text": "连接外部数据库"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 3, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-007", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003ePydantic 在结构化输出中的作用是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 提高模型的推理速度\u003c/li\u003e\n\u003cli\u003eB. 定义数据模型的 Schema，用于验证和题目解析模型的结构化输出\u003c/li\u003e\n\u003cli\u003eC. 生成更多样化的文本\u003c/li\u003e\n\u003cli\u003eD. 连接外部数据库\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Pydantic 可以用来定义结构化数据应该长什么样，比如有哪些字段、字段类型是什么、哪些字段必填。模型输出 JSON 后，可以用 Pydantic 检查它是否符合 Schema，并把输出解析成程序里可用的数据对象。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePydantic 不提升模型推理速度。\u003c/li\u003e\n\u003cli\u003ePydantic 不控制文本多样性，文本多样性更多和 Temperature、Top-p 有关。\u003c/li\u003e\n\u003cli\u003ePydantic 本身不是数据库连接工具。\u003c/li\u003e\n\u003cli\u003e选项 B 中“题目解析模型”更像表述问题，按语义应理解为“验证和解析模型的结构化输出”。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePydantic = 定义 Schema + 验证结构化输出 + 解析为可用数据对象。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "选项 B 的“题目解析模型”按上下文应为“解析模型”，原选项不改写。Pydantic 校验结构与约束，不能自动验证事实。", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-008", "title": "2026-05-23 Prompt 回归测试的目的", "stem": "\"Prompt 回归测试\"的目的是什么？", "options": [{"key": "A", "text": "测试模型在新硬件上的性能"}, {"key": "B", "text": "在修改 Prompt 后，验证新版本不会降低原有用例的通过率"}, {"key": "C", "text": "测试模型的最大上下文长度"}, {"key": "D", "text": "评估模型的创意写作能力"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-008", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Prompt 回归测试\"的目的是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 测试模型在新硬件上的性能\u003c/li\u003e\n\u003cli\u003eB. 在修改 Prompt 后，验证新版本不会降低原有用例的通过率\u003c/li\u003e\n\u003cli\u003eC. 测试模型的最大上下文长度\u003c/li\u003e\n\u003cli\u003eD. 评估模型的创意写作能力\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Prompt 回归测试就是在改 Prompt 之后，把以前通过的测试用例重新跑一遍，确认新 Prompt 没有把原来能做对的场景弄坏。它的核心是防止“修了一个问题，破坏了另一个问题”。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e硬件性能测试不是 Prompt 回归测试。\u003c/li\u003e\n\u003cli\u003e最大上下文长度测试属于模型能力或系统限制测试。\u003c/li\u003e\n\u003cli\u003e创意写作评估不是回归测试的核心目标。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 回归测试 = 修改 Prompt 后重跑旧用例，确认原有能力没有退化。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-009", "title": "2026-05-23 Scratchpad 技术的含义", "stem": "\"Scratchpad\"（草稿本）技术在提示词工程中是指什么？", "options": [{"key": "A", "text": "要求模型先在内部\"草稿区\"进行推理，再输出最终答案"}, {"key": "B", "text": "在 Prompt 中提供额外的背景信息"}, {"key": "C", "text": "让模型生成多个候选答案"}, {"key": "D", "text": "要求模型输出 Markdown 格式"}], "answer": ["A"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-009", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Scratchpad\"（草稿本）技术在提示词工程中是指什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 要求模型先在内部\"草稿区\"进行推理，再输出最终答案\u003c/li\u003e\n\u003cli\u003eB. 在 Prompt 中提供额外的背景信息\u003c/li\u003e\n\u003cli\u003eC. 让模型生成多个候选答案\u003c/li\u003e\n\u003cli\u003eD. 要求模型输出 Markdown 格式\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：A\u003c/p\u003e\n\u003cp\u003e大白话解析： Scratchpad 就像给模型一张草稿纸，让它先整理中间推理、计算或分析，再基于这些中间过程给最终答案。它的目标是提升复杂任务的可靠性，避免模型直接跳到结论。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e额外背景信息是上下文补充，不是 Scratchpad。\u003c/li\u003e\n\u003cli\u003e多个候选答案更接近多样采样或自一致性相关做法，不是草稿本技术本身。\u003c/li\u003e\n\u003cli\u003eMarkdown 是输出格式要求，和是否使用草稿区推理无关。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eScratchpad = 先用草稿区进行中间推理，再输出最终答案。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-010", "title": "2026-05-23 精确率和召回率的含义", "stem": "在评估 Prompt 质量时，\"精确率\"和\"召回率\"分别衡量什么？", "options": [{"key": "A", "text": "精确率衡量速度，召回率衡量准确性"}, {"key": "B", "text": "精确率衡量正确输出中有多少是真正正确的，召回率衡量所有正确案例中有多少被正确识别"}, {"key": "C", "text": "精确率衡量输出长度，召回率衡量输出多样性"}, {"key": "D", "text": "两者都衡量模型的推理深度"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-010", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在评估 Prompt 质量时，\"精确率\"和\"召回率\"分别衡量什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 精确率衡量速度，召回率衡量准确性\u003c/li\u003e\n\u003cli\u003eB. 精确率衡量正确输出中有多少是真正正确的，召回率衡量所有正确案例中有多少被正确识别\u003c/li\u003e\n\u003cli\u003eC. 精确率衡量输出长度，召回率衡量输出多样性\u003c/li\u003e\n\u003cli\u003eD. 两者都衡量模型的推理深度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 精确率看模型“说是对的/判为目标类的”里面，有多少真的对；召回率看所有本来应该被识别出来的正确案例里，模型找出了多少。前者关注少误报，后者关注少漏报。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e精确率和召回率都不是速度、输出长度、输出多样性或推理深度指标。\u003c/li\u003e\n\u003cli\u003e精确率高不代表召回率一定高；模型很保守时可能误报少，但漏掉很多正确案例。\u003c/li\u003e\n\u003cli\u003e召回率高也不代表精确率一定高；模型全都判为正可能漏报少，但误报很多。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e精确率 = 判为正的里面有多少真正；召回率 = 真正该找出的里面找出了多少。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "原 B 表述不精确；精确率=真正例/(真正例+假正例)，召回率=真正例/(真正例+假负例)，必须先规定正类。", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-011", "title": "2026-05-23 多模态任务中的 Prompt 额外考虑因素", "stem": "在多模态任务中（如图文理解），Prompt 工程需要额外考虑哪个因素？", "options": [{"key": "A", "text": "文本 token 的数量"}, {"key": "B", "text": "图像与文本的对齐方式，以及如何在提示中引导模型关联视觉信息与文字指令"}, {"key": "C", "text": "模型的推理速度"}, {"key": "D", "text": "输出的字体格式"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 8, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-011", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在多模态任务中（如图文理解），Prompt 工程需要额外考虑哪个因素？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 文本 token 的数量\u003c/li\u003e\n\u003cli\u003eB. 图像与文本的对齐方式，以及如何在提示中引导模型关联视觉信息与文字指令\u003c/li\u003e\n\u003cli\u003eC. 模型的推理速度\u003c/li\u003e\n\u003cli\u003eD. 输出的字体格式\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 多模态任务不只是处理文字，还要处理图片、截图、表格图、图文混排等视觉信息。因此 Prompt 要说清楚模型应该看图里的哪些区域、如何结合文字问题、是否需要引用图中证据、不要凭空猜测图中没有的信息。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e文本 token 数量仍然重要，但不是多模态任务最额外、最核心的因素。\u003c/li\u003e\n\u003cli\u003e推理速度是性能问题，不是多模态 Prompt 设计重点。\u003c/li\u003e\n\u003cli\u003e字体格式通常不是模型输出质量的核心因素。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e多模态 Prompt = 明确图像和文本如何对齐、如何引用视觉证据、如何按文字指令分析图中信息。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-012", "title": "2026-05-23 Tree of Thoughts 与 Chain-of-Thought 的区别", "stem": "Tree of Thoughts（ToT）与 Chain-of-Thought 的主要区别是什么？", "options": [{"key": "A", "text": "ToT 不需要中间步骤"}, {"key": "B", "text": "ToT 探索多个推理分支并评估，CoT 只走一条线性路径"}, {"key": "C", "text": "ToT 专为代码生成设计"}, {"key": "D", "text": "CoT 需要更多示例"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-012", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eTree of Thoughts（ToT）与 Chain-of-Thought 的主要区别是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. ToT 不需要中间步骤\u003c/li\u003e\n\u003cli\u003eB. ToT 探索多个推理分支并评估，CoT 只走一条线性路径\u003c/li\u003e\n\u003cli\u003eC. ToT 专为代码生成设计\u003c/li\u003e\n\u003cli\u003eD. CoT 需要更多示例\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： CoT 像是一条线，从第一步推到最后一步；ToT 像一棵树，会同时考虑多个可能的思路分支，对不同分支进行评估、选择或回溯。ToT 更适合需要搜索、比较方案、规划路径的复杂任务。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eToT 也需要中间步骤，只是中间步骤不止一条线。\u003c/li\u003e\n\u003cli\u003eToT 不是专门为代码生成设计的，更多是复杂推理和规划方法。\u003c/li\u003e\n\u003cli\u003eCoT 不一定需要更多示例，Zero-shot CoT 甚至可以不提供示例。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCoT = 一条推理链；ToT = 多条推理分支 + 评估选择。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-013", "title": "2026-05-23 A/B 测试中的变量控制原则", "stem": "在进行 A/B 测试时，一次应该改变几个变量？", "options": [{"key": "A", "text": "尽量多，节省时间"}, {"key": "B", "text": "只改变一个变量，以便准确归因效果差异"}, {"key": "C", "text": "至少改变三个变量"}, {"key": "D", "text": "根据任务复杂度决定"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-013", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在进行 A/B 测试时，一次应该改变几个变量？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 尽量多，节省时间\u003c/li\u003e\n\u003cli\u003eB. 只改变一个变量，以便准确归因效果差异\u003c/li\u003e\n\u003cli\u003eC. 至少改变三个变量\u003c/li\u003e\n\u003cli\u003eD. 根据任务复杂度决定\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： A/B 测试要判断“到底是什么改动带来了效果变化”。如果一次改很多变量，结果变好或变差时就不知道是哪一个变量造成的。所以标准做法是一次只改一个关键变量，其他条件保持一致。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e一次改很多变量看似省时间，但会导致无法归因。\u003c/li\u003e\n\u003cli\u003e“根据任务复杂度决定”听起来灵活，但 A/B 测试的核心原则仍然是控制变量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA/B 测试 = 一次只改一个变量，方便准确归因。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "保留历史答案 B；想单独归因时应控制其他变量。实际 A/B 可比较整个方案，不能把整体差异归因于其中一个改动。", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-014", "title": "2026-05-23 减少模型幻觉的常见 Prompt 策略", "stem": "减少模型幻觉的常见 Prompt 策略是什么？", "options": [{"key": "A", "text": "增加 Temperature 参数"}, {"key": "B", "text": "要求模型引用来源，或在不确定时明确表示不知道"}, {"key": "C", "text": "减少 System Prompt 的长度"}, {"key": "D", "text": "使用更多 Few-shot 示例"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 7, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-014", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e减少模型幻觉的常见 Prompt 策略是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 增加 Temperature 参数\u003c/li\u003e\n\u003cli\u003eB. 要求模型引用来源，或在不确定时明确表示不知道\u003c/li\u003e\n\u003cli\u003eC. 减少 System Prompt 的长度\u003c/li\u003e\n\u003cli\u003eD. 使用更多 Few-shot 示例\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 减少幻觉的关键是让模型不要凭空编。可以要求它基于给定资料回答、引用来源或证据；如果资料不足或不确定，就明确说“不知道”或“无法判断”。这比强迫模型必须回答更安全。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e增加 Temperature 会提高随机性，通常更容易发散，不利于减少幻觉。\u003c/li\u003e\n\u003cli\u003eSystem Prompt 不是越短越好，关键是要包含事实依据和不确定性处理规则。\u003c/li\u003e\n\u003cli\u003eFew-shot 示例可能有帮助，但“更多”不一定更好，也不是最直接的防幻觉策略。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e减少幻觉 = 要求依据/引用来源 + 信息不足时明确说不知道。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-015", "title": "2026-05-23 多语言任务中的 Prompt 策略", "stem": "在处理多语言任务时，以下哪种 Prompt 策略通常效果最好？", "options": [{"key": "A", "text": "始终用英文写 Prompt，让模型自动处理多语言"}, {"key": "B", "text": "用目标语言写 Prompt，并明确指定输入输出的语言要求"}, {"key": "C", "text": "使用翻译 API 将所有内容先转换为英文"}, {"key": "D", "text": "在 Prompt 中同时提供所有语言版本"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 8, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-015", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在处理多语言任务时，以下哪种 Prompt 策略通常效果最好？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 始终用英文写 Prompt，让模型自动处理多语言\u003c/li\u003e\n\u003cli\u003eB. 用目标语言写 Prompt，并明确指定输入输出的语言要求\u003c/li\u003e\n\u003cli\u003eC. 使用翻译 API 将所有内容先转换为英文\u003c/li\u003e\n\u003cli\u003eD. 在 Prompt 中同时提供所有语言版本\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 多语言任务中，最好明确告诉模型输入是什么语言、输出应该用什么语言。如果目标是中文输出，就用中文写清楚要求；如果要英文、日文或中英双语，也要明确指定，避免模型自行猜测语言。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e始终用英文不一定最适合所有语言任务，尤其当目标用户和输出都是中文时。\u003c/li\u003e\n\u003cli\u003e先翻译成英文可能引入翻译误差，也不一定必要。\u003c/li\u003e\n\u003cli\u003e同时提供所有语言版本会增加 token 和混乱，不一定提升效果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e多语言 Prompt = 用目标语言写清任务，并明确输入语言、输出语言和是否需要翻译。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "B 适合作为明确语言约定的起点；目标语言或英语谁效果最好，取决于模型和任务，不是普遍排名。", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-016", "title": "2026-05-23 LLM-as-Judge 的含义", "stem": "在评估 Prompt 效果时，\"LLM-as-Judge\"方法是指什么？", "options": [{"key": "A", "text": "使用人类专家评估模型输出"}, {"key": "B", "text": "使用另一个 LLM 对目标模型的输出进行打分或评估"}, {"key": "C", "text": "使用规则引擎自动评分"}, {"key": "D", "text": "使用用户反馈数据评估"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-016", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在评估 Prompt 效果时，\"LLM-as-Judge\"方法是指什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 使用人类专家评估模型输出\u003c/li\u003e\n\u003cli\u003eB. 使用另一个 LLM 对目标模型的输出进行打分或评估\u003c/li\u003e\n\u003cli\u003eC. 使用规则引擎自动评分\u003c/li\u003e\n\u003cli\u003eD. 使用用户反馈数据评估\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： LLM-as-Judge 就是让一个大模型充当评委，按照评分标准去评估另一个模型的输出。它可以做打分、排序、比较两个答案、检查是否符合要求等。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e人类专家评估是人工评审，不是 LLM-as-Judge。\u003c/li\u003e\n\u003cli\u003e规则引擎评分是基于固定规则，不是让 LLM 做判断。\u003c/li\u003e\n\u003cli\u003e用户反馈数据可以用于评估，但不是 LLM-as-Judge 的定义。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLLM-as-Judge = 用另一个 LLM 按标准评估目标模型输出。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "可让不同模型或同类模型做评委，关键是模型按量规评价输出；并不要求不同厂商，仍需人工校准与偏差检查。", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-017", "title": "2026-05-23 多轮对话中的 Prompt 工程注意点", "stem": "在使用多轮对话时，Prompt 工程师需要特别注意什么？", "options": [{"key": "A", "text": "每轮都要重复整个 System Prompt"}, {"key": "B", "text": "上下文窗口限制、历史对话的截断策略和角色一致性维护"}, {"key": "C", "text": "每轮都要提供新的 Few-shot 示例"}, {"key": "D", "text": "避免在对话中使用代词"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 8, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-017", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在使用多轮对话时，Prompt 工程师需要特别注意什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 每轮都要重复整个 System Prompt\u003c/li\u003e\n\u003cli\u003eB. 上下文窗口限制、历史对话的截断策略和角色一致性维护\u003c/li\u003e\n\u003cli\u003eC. 每轮都要提供新的 Few-shot 示例\u003c/li\u003e\n\u003cli\u003eD. 避免在对话中使用代词\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 多轮对话会不断积累历史内容，但模型上下文窗口有限。工程上要考虑哪些历史需要保留、哪些可以摘要或截断，以及截断后模型是否还能保持原来的角色、规则和任务状态。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e不需要每轮重复整个 System Prompt，但要保证核心约束持续有效。\u003c/li\u003e\n\u003cli\u003e每轮都给新 Few-shot 示例会增加 token 成本，也可能干扰已有上下文。\u003c/li\u003e\n\u003cli\u003e代词不是绝对不能用，关键是上下文是否清楚。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e多轮对话 Prompt 设计 = 管理上下文窗口、历史截断/摘要、状态追踪和角色一致性。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-018", "title": "2026-05-23 Prompt Compression 技术", "stem": "以下哪项正确描述了\"Prompt 压缩\"（Prompt Compression）技术？", "options": [{"key": "A", "text": "将长 Prompt 缩短为一句话"}, {"key": "B", "text": "使用算法或模型自动精简 Prompt 内容，在保持语义的前提下减少 token 消耗"}, {"key": "C", "text": "将多个 Prompt 合并为一个"}, {"key": "D", "text": "降低模型输出的精度"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 4, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-018", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪项正确描述了\"Prompt 压缩\"（Prompt Compression）技术？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 将长 Prompt 缩短为一句话\u003c/li\u003e\n\u003cli\u003eB. 使用算法或模型自动精简 Prompt 内容，在保持语义的前提下减少 token 消耗\u003c/li\u003e\n\u003cli\u003eC. 将多个 Prompt 合并为一个\u003c/li\u003e\n\u003cli\u003eD. 降低模型输出的精度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Prompt 压缩的目标是在不丢关键语义、不明显影响效果的前提下，减少 Prompt 的 token 数。它可以通过删除冗余内容、压缩上下文、保留关键信息等方式完成，常用于降低成本、减少延迟、节省上下文窗口。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e压缩不是强行缩成一句话；太短可能丢失关键约束。\u003c/li\u003e\n\u003cli\u003e合并多个 Prompt 不是压缩的定义，合并后可能更长。\u003c/li\u003e\n\u003cli\u003e降低输出精度不是目标，好的压缩应尽量保持效果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt Compression = 保持语义和效果的前提下，自动精简 Prompt，减少 token 消耗。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-019", "title": "2026-05-23 RAG 与 Prompt 工程的结合点", "stem": "RAG（检索增强生成）技术与 Prompt 工程的结合点是什么？", "options": [{"key": "A", "text": "RAG 替代了 Prompt 的作用"}, {"key": "B", "text": "将检索到的相关文档片段插入 Prompt 上下文，为模型提供事实依据"}, {"key": "C", "text": "RAG 用于优化 System Prompt"}, {"key": "D", "text": "RAG 减少了 Prompt 的 token 消耗"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 7, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-019", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRAG（检索增强生成）技术与 Prompt 工程的结合点是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. RAG 替代了 Prompt 的作用\u003c/li\u003e\n\u003cli\u003eB. 将检索到的相关文档片段插入 Prompt 上下文，为模型提供事实依据\u003c/li\u003e\n\u003cli\u003eC. RAG 用于优化 System Prompt\u003c/li\u003e\n\u003cli\u003eD. RAG 减少了 Prompt 的 token 消耗\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： RAG 的核心是先从知识库、文档库或数据库里检索相关内容，再把这些内容放进 Prompt 的上下文中，让模型基于这些资料回答。它不是替代 Prompt，而是给 Prompt 增加事实依据。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRAG 不会替代 Prompt，仍然需要 Prompt 规定任务、格式、约束和依据使用方式。\u003c/li\u003e\n\u003cli\u003eRAG 不是专门优化 System Prompt 的技术。\u003c/li\u003e\n\u003cli\u003eRAG 往往会把检索片段加入上下文，token 消耗可能增加；它的主要目标是提升事实性，不是减少 token。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRAG + Prompt = 把检索到的相关文档作为上下文证据，让模型基于事实回答。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-020", "title": "2026-06-11 Few-shot prompting 的核心思想", "stem": "Few-shot prompting 的核心思想是什么？", "options": [{"key": "A", "text": "通过角色扮演引导模型"}, {"key": "B", "text": "在提示中提供少量输入输出示例，帮助模型理解任务格式"}, {"key": "C", "text": "要求模型逐步推理"}, {"key": "D", "text": "限制模型的输出长度"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-020", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eFew-shot prompting 的核心思想是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 通过角色扮演引导模型\u003c/li\u003e\n\u003cli\u003eB. 在提示中提供少量输入输出示例，帮助模型理解任务格式\u003c/li\u003e\n\u003cli\u003eC. 要求模型逐步推理\u003c/li\u003e\n\u003cli\u003eD. 限制模型的输出长度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Few-shot prompting 就是在 Prompt 里放几个“样例题”，让模型通过这些示例看懂任务要怎么做、输入输出格式是什么、判断标准大概是什么。它不需要改模型参数，只是靠当前上下文里的示例来引导模型。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 是角色提示 Role prompting，不是 Few-shot。\u003c/li\u003e\n\u003cli\u003eC 是 Chain-of-Thought 或分步推理提示，不是 Few-shot 的核心。\u003c/li\u003e\n\u003cli\u003eD 是长度约束，不是示例学习。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFew-shot = 给少量输入输出示例，让模型照着格式和规律完成新任务。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-021", "title": "2026-06-11 Chain-of-Verification 的步骤", "stem": "\"Chain-of-Verification\"（验证链）技术的步骤是什么？", "options": [{"key": "A", "text": "生成答案→列出可用于验证答案的问题→独立回答每个验证问题→基于验证结果修正最终答案"}, {"key": "B", "text": "多次运行推理链并投票"}, {"key": "C", "text": "要求模型列出信息来源后验证"}, {"key": "D", "text": "人工审核模型输出"}], "answer": ["A"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-021", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Chain-of-Verification\"（验证链）技术的步骤是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 生成答案→列出可用于验证答案的问题→独立回答每个验证问题→基于验证结果修正最终答案\u003c/li\u003e\n\u003cli\u003eB. 多次运行推理链并投票\u003c/li\u003e\n\u003cli\u003eC. 要求模型列出信息来源后验证\u003c/li\u003e\n\u003cli\u003eD. 人工审核模型输出\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：A\u003c/p\u003e\n\u003cp\u003e大白话解析： Chain-of-Verification 的核心是让模型不要生成完答案就结束，而是主动检查自己的答案。流程通常是先给出初始答案，再围绕这个答案提出验证问题，然后独立回答这些验证问题，最后根据验证结果修正原答案。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eB 更接近 Self-consistency：多次生成推理路径再投票。\u003c/li\u003e\n\u003cli\u003eC 只强调来源验证，不是完整的验证链流程。\u003c/li\u003e\n\u003cli\u003eD 是人工审核，不是模型自我验证流程。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eChain-of-Verification = 先答题，再提验证问题，独立验证，最后修正答案。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-022", "title": "2026-06-11 Maieutic prompting 的特点", "stem": "\"Maieutic prompting\"（助产式提示）源自苏格拉底教学法，其特点是什么？", "options": [{"key": "A", "text": "直接给出答案后要求模型记忆"}, {"key": "B", "text": "通过一系列引导性问题逐步帮助模型自己\"推导\"出正确答案"}, {"key": "C", "text": "让模型批评其他模型的输出"}, {"key": "D", "text": "要求模型用比喻解释复杂概念"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 11, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-022", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Maieutic prompting\"（助产式提示）源自苏格拉底教学法，其特点是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 直接给出答案后要求模型记忆\u003c/li\u003e\n\u003cli\u003eB. 通过一系列引导性问题逐步帮助模型自己\"推导\"出正确答案\u003c/li\u003e\n\u003cli\u003eC. 让模型批评其他模型的输出\u003c/li\u003e\n\u003cli\u003eD. 要求模型用比喻解释复杂概念\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Maieutic prompting 借鉴苏格拉底式教学，不是直接把答案塞给模型，而是通过连续的引导性问题，让模型一步步检查前提、分析条件、排除错误，最后推导出更合理的答案。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 是直接告知答案，不是助产式提示。\u003c/li\u003e\n\u003cli\u003eC 更像模型评审或 critique，不是 Maieutic prompting 的核心。\u003c/li\u003e\n\u003cli\u003eD 是类比解释技巧，不是助产式提示。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaieutic prompting = 用一连串引导性问题帮助模型逐步推导答案。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "保留历史答案 B；论文 Maieutic Prompting 还包括递归解释树和逻辑一致性推断，不能等同于普通连续提问。", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-023", "title": "2026-06-11 构建测试集时推荐的数据分布", "stem": "构建测试集时，推荐的数据分布通常包括哪几类？", "options": [{"key": "A", "text": "简单题、中等题、困难题"}, {"key": "B", "text": "典型用例、边界用例、对抗用例、异常用例"}, {"key": "C", "text": "正确答案、错误答案、模糊答案"}, {"key": "D", "text": "长文本、短文本、代码文本"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-023", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e构建测试集时，推荐的数据分布通常包括哪几类？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 简单题、中等题、困难题\u003c/li\u003e\n\u003cli\u003eB. 典型用例、边界用例、对抗用例、异常用例\u003c/li\u003e\n\u003cli\u003eC. 正确答案、错误答案、模糊答案\u003c/li\u003e\n\u003cli\u003eD. 长文本、短文本、代码文本\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 评测 Prompt 不能只看正常情况，还要看各种容易出问题的情况。典型用例测试日常表现，边界用例测试临界条件，对抗用例测试是否容易被诱导或绕过规则，异常用例测试输入缺失、格式错误、不符合预期时是否能稳定处理。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 的难度分层有价值，但不如 B 覆盖 Prompt 工程中的真实风险类型。\u003c/li\u003e\n\u003cli\u003eC 更像答案类型，不是完整的测试用例分布设计。\u003c/li\u003e\n\u003cli\u003eD 是输入形态分类，不足以覆盖边界、攻击和异常情况。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 测试集 = 典型用例 + 边界用例 + 对抗用例 + 异常用例。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-024", "title": "2026-06-11 Zero-shot prompting 的定义", "stem": "以下哪种提示方式不向模型提供任何示例，直接要求模型完成任务？", "options": [{"key": "A", "text": "Few-shot prompting"}, {"key": "B", "text": "Zero-shot prompting"}, {"key": "C", "text": "Chain-of-Thought prompting"}, {"key": "D", "text": "Role prompting"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-024", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种提示方式不向模型提供任何示例，直接要求模型完成任务？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. Few-shot prompting\u003c/li\u003e\n\u003cli\u003eB. Zero-shot prompting\u003c/li\u003e\n\u003cli\u003eC. Chain-of-Thought prompting\u003c/li\u003e\n\u003cli\u003eD. Role prompting\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Zero-shot prompting 就是不提供输入输出示例，直接告诉模型任务，让模型凭已有能力完成。比如只写“请判断下面评论的情感倾向”，但不给任何示例，这就是 Zero-shot。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFew-shot 会提供少量示例。\u003c/li\u003e\n\u003cli\u003eChain-of-Thought 强调逐步推理，不等于不给示例；它可以是 zero-shot CoT，也可以配合示例。\u003c/li\u003e\n\u003cli\u003eRole prompting 强调设定角色，比如“你是客服专家”，不是示例数量的分类。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eZero-shot = 不给示例，直接下任务。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-025", "title": "2026-06-11 提高模型在专业领域表现的 Prompt 做法", "stem": "以下哪种做法最有助于提高模型在专业领域的表现？", "options": [{"key": "A", "text": "仅依赖模型的预训练知识"}, {"key": "B", "text": "结合领域专业术语、专业示例和明确的领域约束进行 Prompt 设计"}, {"key": "C", "text": "使用最短的 Prompt"}, {"key": "D", "text": "避免在 Prompt 中使用专业词汇"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-025", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种做法最有助于提高模型在专业领域的表现？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 仅依赖模型的预训练知识\u003c/li\u003e\n\u003cli\u003eB. 结合领域专业术语、专业示例和明确的领域约束进行 Prompt 设计\u003c/li\u003e\n\u003cli\u003eC. 使用最短的 Prompt\u003c/li\u003e\n\u003cli\u003eD. 避免在 Prompt 中使用专业词汇\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 专业领域任务通常有专门术语、判断标准、行业规范和边界条件。Prompt 里要把这些领域信息讲清楚，最好给专业示例和明确约束，让模型按该领域的规则回答，而不是只靠泛泛的常识。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e只依赖预训练知识，容易过时、泛化或不符合具体业务标准。\u003c/li\u003e\n\u003cli\u003ePrompt 不是越短越好，关键是必要信息要完整。\u003c/li\u003e\n\u003cli\u003e专业词汇不能一概避免；在专业任务里，正确使用术语反而能减少歧义。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e专业领域 Prompt = 领域术语 + 专业示例 + 明确约束 + 必要背景。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-026", "title": "2026-06-11 Question-first 策略的好处", "stem": "在 Prompt 中使用\"先提问再回答\"（Question-first）策略的好处是什么？", "options": [{"key": "A", "text": "减少模型的推理时间"}, {"key": "B", "text": "让模型在生成答案之前先明确问题的核心，避免答非所问"}, {"key": "C", "text": "提高模型的创意输出"}, {"key": "D", "text": "减少 Prompt 的 token 消耗"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 11, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-026", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在 Prompt 中使用\"先提问再回答\"（Question-first）策略的好处是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 减少模型的推理时间\u003c/li\u003e\n\u003cli\u003eB. 让模型在生成答案之前先明确问题的核心，避免答非所问\u003c/li\u003e\n\u003cli\u003eC. 提高模型的创意输出\u003c/li\u003e\n\u003cli\u003eD. 减少 Prompt 的 token 消耗\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Question-first 策略就是让模型先把问题核心弄清楚，再开始回答。这样可以减少模型还没理解清楚就直接输出的情况，尤其适合问题复杂、条件多、容易误解的任务。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e它不一定减少推理时间，反而可能多一步澄清或分析。\u003c/li\u003e\n\u003cli\u003e它不是为了提高创意输出。\u003c/li\u003e\n\u003cli\u003e先提问或先明确问题通常会增加一些 token，不是为了减少 token 消耗。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuestion-first = 先明确问题核心，再回答，避免答非所问。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-027", "title": "2026-06-11 避免模型输出有偏见内容的提示方式", "stem": "以下哪种方式最能有效引导模型避免输出有偏见的内容？", "options": [{"key": "A", "text": "完全不提及偏见话题"}, {"key": "B", "text": "在 System Prompt 中明确要求公平、平衡地对待不同群体，并在敏感话题上要求呈现多方观点"}, {"key": "C", "text": "使用更高的 Temperature 增加多样性"}, {"key": "D", "text": "减少 Prompt 中的示例数量"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 10, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-027", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种方式最能有效引导模型避免输出有偏见的内容？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 完全不提及偏见话题\u003c/li\u003e\n\u003cli\u003eB. 在 System Prompt 中明确要求公平、平衡地对待不同群体，并在敏感话题上要求呈现多方观点\u003c/li\u003e\n\u003cli\u003eC. 使用更高的 Temperature 增加多样性\u003c/li\u003e\n\u003cli\u003eD. 减少 Prompt 中的示例数量\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 要减少偏见，不能靠回避话题，而要在系统层明确行为规范。比如要求模型公平对待不同群体、不使用刻板印象、不把个体问题泛化到群体，并且在敏感话题上尽量平衡呈现多方观点。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 回避偏见话题不等于解决偏见；模型遇到相关问题时仍可能处理不好。\u003c/li\u003e\n\u003cli\u003eC 提高 Temperature 只会增加随机性，不会自动变公平。\u003c/li\u003e\n\u003cli\u003eD 减少示例数量不能直接减少偏见；如果示例本身有偏，反而要校准示例质量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e避免偏见 = 在 System Prompt 中明确公平、平衡、反刻板印象和敏感话题处理规则。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-028", "title": "2026-06-11 Decomposed prompting 与 Prompt chaining 的关系", "stem": "\"Decomposed prompting\"（分解式提示）与\"Prompt chaining\"的关系是什么？", "options": [{"key": "A", "text": "两者完全相同"}, {"key": "B", "text": "分解式提示是一种 Prompt chaining 的设计方法，强调通过专用子提示处理不同子任务"}, {"key": "C", "text": "分解式提示不使用多次 API 调用"}, {"key": "D", "text": "Prompt chaining 不需要分解任务"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 6, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-028", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Decomposed prompting\"（分解式提示）与\"Prompt chaining\"的关系是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 两者完全相同\u003c/li\u003e\n\u003cli\u003eB. 分解式提示是一种 Prompt chaining 的设计方法，强调通过专用子提示处理不同子任务\u003c/li\u003e\n\u003cli\u003eC. 分解式提示不使用多次 API 调用\u003c/li\u003e\n\u003cli\u003eD. Prompt chaining 不需要分解任务\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 分解式提示就是把一个复杂任务拆成多个更小的子任务，每个子任务用专门的 Prompt 处理。Prompt chaining 则是把这些步骤串起来，让前一步的输出成为后一步的输入。因此，分解式提示可以看作 Prompt chaining 的一种设计方式。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e两者关系很近，但不完全等同。分解式提示强调“拆任务”，Prompt chaining 强调“步骤串联”。\u003c/li\u003e\n\u003cli\u003e分解式提示在工程实现中经常会涉及多次调用，也可能在一次 Prompt 内模拟多个步骤，不能说它一定不使用多次 API 调用。\u003c/li\u003e\n\u003cli\u003ePrompt chaining 通常就是为了把复杂任务拆成多个步骤处理。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDecomposed prompting = 拆子任务；Prompt chaining = 把子任务步骤串起来执行。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-029", "title": "2026-06-11 Multi-Agent 系统中 Agent Prompt 的设计原则", "stem": "在多智能体（Multi-Agent）系统中，每个 Agent 的 Prompt 设计应遵循什么原则？", "options": [{"key": "A", "text": "所有 Agent 共用同一个 System Prompt，保持一致性"}, {"key": "B", "text": "每个 Agent 有明确的职责边界，Prompt 定义其专属能力、输入来源和输出格式"}, {"key": "C", "text": "Agent 的 Prompt 越长越好，覆盖所有可能情况"}, {"key": "D", "text": "Agent 之间不需要约定交互格式"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 6, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-029", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e在多智能体（Multi-Agent）系统中，每个 Agent 的 Prompt 设计应遵循什么原则？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 所有 Agent 共用同一个 System Prompt，保持一致性\u003c/li\u003e\n\u003cli\u003eB. 每个 Agent 有明确的职责边界，Prompt 定义其专属能力、输入来源和输出格式\u003c/li\u003e\n\u003cli\u003eC. Agent 的 Prompt 越长越好，覆盖所有可能情况\u003c/li\u003e\n\u003cli\u003eD. Agent 之间不需要约定交互格式\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 多智能体系统里，每个 Agent 应该像团队里的不同岗位一样，各自负责清楚的任务。Prompt 需要定义它负责什么、不负责什么、能使用哪些输入、产出什么格式，以及如何和其他 Agent 交接结果。这样才能减少职责重叠、重复工作和输出混乱。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e所有 Agent 共用同一个 System Prompt 会导致分工不清，不适合多角色协作。\u003c/li\u003e\n\u003cli\u003ePrompt 不是越长越好，关键是职责、边界和接口清晰。\u003c/li\u003e\n\u003cli\u003eAgent 之间必须约定交互格式，否则前一个 Agent 的输出可能无法被后一个 Agent 稳定使用。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMulti-Agent Prompt = 明确每个 Agent 的职责边界、专属能力、输入来源、输出格式和协作接口。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "02-030", "title": "2026-06-11 Function Calling 的主要作用", "stem": "Function Calling（函数调用）在 LLM 中的主要作用是什么？", "options": [{"key": "A", "text": "让模型自动编写函数代码"}, {"key": "B", "text": "让模型以结构化方式输出参数，触发外部函数或 API 调用"}, {"key": "C", "text": "提高模型的数学计算能力"}, {"key": "D", "text": "让模型记忆历史对话"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 6, "source": "PromptEngenering/题目/历史题目_02.md", "anchor": "s-02-030", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eFunction Calling（函数调用）在 LLM 中的主要作用是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 让模型自动编写函数代码\u003c/li\u003e\n\u003cli\u003eB. 让模型以结构化方式输出参数，触发外部函数或 API 调用\u003c/li\u003e\n\u003cli\u003eC. 提高模型的数学计算能力\u003c/li\u003e\n\u003cli\u003eD. 让模型记忆历史对话\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Function Calling 的作用是让模型判断什么时候需要调用外部函数，并按函数要求生成结构化参数。真正执行函数或 API 的通常是外部系统，不是模型自己直接执行。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFunction Calling 不是让模型自动写函数代码，而是调用已经定义好的函数或工具。\u003c/li\u003e\n\u003cli\u003e它可以借助计算器等工具间接提升计算可靠性，但本身不是提高模型数学能力。\u003c/li\u003e\n\u003cli\u003e历史对话记忆属于上下文管理或记忆系统，不是 Function Calling 的主要作用。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFunction Calling = 模型生成结构化调用参数，由外部系统执行函数/API。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "c27fe64450a9bdfdd440cffc202b5ae2090d4112059c443cdc5bf1ae1a77cad2"}, {"id": "03-001", "title": "2026-06-11 同一 Prompt 在不同模型上效果差异的原因", "stem": "以下哪个因素会导致同一 Prompt 在不同模型上效果差异显著？", "options": [{"key": "A", "text": "服务器地理位置"}, {"key": "B", "text": "不同模型的预训练数据、RLHF 偏好和指令遵循能力存在差异"}, {"key": "C", "text": "请求的时间段"}, {"key": "D", "text": "用户账号的订阅等级"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 9, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-001", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪个因素会导致同一 Prompt 在不同模型上效果差异显著？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 服务器地理位置\u003c/li\u003e\n\u003cli\u003eB. 不同模型的预训练数据、RLHF 偏好和指令遵循能力存在差异\u003c/li\u003e\n\u003cli\u003eC. 请求的时间段\u003c/li\u003e\n\u003cli\u003eD. 用户账号的订阅等级\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 不同模型不是“同一个脑子”。它们训练用的数据、模型结构、对齐方式、RLHF 偏好、安全策略、指令遵循能力都可能不同。所以同一个 Prompt，在一个模型上表现稳定，在另一个模型上可能格式乱、理解偏、拒答多或回答风格不同。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e服务器地理位置通常不是 Prompt 效果差异的核心原因。\u003c/li\u003e\n\u003cli\u003e请求时间段一般不会决定模型理解能力。\u003c/li\u003e\n\u003cli\u003e用户订阅等级可能影响能用哪个模型或额度，但不是同一 Prompt 在不同模型上表现差异的本质原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 效果会受模型差异影响：预训练数据、对齐偏好、能力边界和指令遵循能力都不同。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "660d1eb1b293a348896afb74b5ce7be9ee2ddb4e3217fbdb32640c162f36b7b6"}, {"id": "03-002", "title": "2026-06-11 Knowledge Cutoff 对 Prompt 工程的影响", "stem": "以下哪种说法正确描述了 LLM 的\"知识截止日期\"（Knowledge Cutoff）对 Prompt 工程的影响？", "options": [{"key": "A", "text": "知识截止日期后的信息模型完全无法处理"}, {"key": "B", "text": "对于知识截止日期之后的信息，需要通过 RAG、搜索工具或在 Prompt 中直接提供最新信息来补充"}, {"key": "C", "text": "只需切换到更新的模型版本即可解决"}, {"key": "D", "text": "通过增加 Temperature 可以让模型\"猜测\"最新信息"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 7, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-002", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种说法正确描述了 LLM 的\"知识截止日期\"（Knowledge Cutoff）对 Prompt 工程的影响？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 知识截止日期后的信息模型完全无法处理\u003c/li\u003e\n\u003cli\u003eB. 对于知识截止日期之后的信息，需要通过 RAG、搜索工具或在 Prompt 中直接提供最新信息来补充\u003c/li\u003e\n\u003cli\u003eC. 只需切换到更新的模型版本即可解决\u003c/li\u003e\n\u003cli\u003eD. 通过增加 Temperature 可以让模型\"猜测\"最新信息\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 知识截止日期表示模型训练知识大致停留在某个时间点。这个时间点之后的新政策、新产品、新价格、新论文、新事件，模型不一定知道，或者知道得不可靠。Prompt 工程上要把最新信息补给模型，比如通过 RAG 检索资料、联网搜索工具，或者直接把最新文档贴进 Prompt。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 说“完全无法处理”太绝对。模型可以处理你提供的新信息，但不能凭空可靠知道新信息。\u003c/li\u003e\n\u003cli\u003eC 不够可靠。更新模型可能知识更新一些，但仍然会有新的截止日期，也不能保证覆盖你的具体业务资料。\u003c/li\u003e\n\u003cli\u003eD 错。Temperature 只控制随机性，不能让模型可靠获得最新事实；让模型猜最新信息会增加幻觉风险。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKnowledge Cutoff 之后的信息，要靠 RAG、搜索工具或 Prompt 中提供资料来补充；不要让模型猜。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "", "source_hash": "660d1eb1b293a348896afb74b5ce7be9ee2ddb4e3217fbdb32640c162f36b7b6"}, {"id": "03-003", "title": "2026-06-11 提升模型对长文档理解能力的方法", "stem": "以下哪种方式最能有效提升模型对长文档的理解能力？", "options": [{"key": "A", "text": "直接将整个文档放入 Prompt"}, {"key": "B", "text": "使用分段摘要、Map-Reduce 或滑动窗口技术处理超长文档"}, {"key": "C", "text": "要求模型忽略文档细节"}, {"key": "D", "text": "增加 Few-shot 示例"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 8, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-003", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种方式最能有效提升模型对长文档的理解能力？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 直接将整个文档放入 Prompt\u003c/li\u003e\n\u003cli\u003eB. 使用分段摘要、Map-Reduce 或滑动窗口技术处理超长文档\u003c/li\u003e\n\u003cli\u003eC. 要求模型忽略文档细节\u003c/li\u003e\n\u003cli\u003eD. 增加 Few-shot 示例\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 长文档通常信息多、结构复杂，甚至可能超过上下文窗口。更稳的做法是把文档切成片段，分别摘要或提取要点，再汇总；或者用滑动窗口保留相邻片段上下文；也可以用 Map-Reduce 先分块处理，再统一合并结果。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e直接塞整篇文档可能超出上下文窗口，也可能导致模型忽略中间细节。\u003c/li\u003e\n\u003cli\u003e要求忽略细节会降低理解质量，不适合需要准确分析的任务。\u003c/li\u003e\n\u003cli\u003eFew-shot 示例可以说明任务格式，但不能根本解决长文档上下文过长和信息组织问题。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e长文档处理 = 分段处理 + 摘要/提取 + Map-Reduce 汇总 + 滑动窗口保留上下文。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "B 对超长或利用不佳文档是有用策略；若全文可容纳且实测表现好，直接长上下文处理也可作合理基线。", "source_hash": "660d1eb1b293a348896afb74b5ce7be9ee2ddb4e3217fbdb32640c162f36b7b6"}, {"id": "03-004", "title": "2026-06-11 Calibration 在 Prompt 工程中的含义", "stem": "\"Calibration\"（校准）在 Prompt 工程中是指什么？", "options": [{"key": "A", "text": "调整模型的训练超参数"}, {"key": "B", "text": "通过设计 Prompt 让模型的置信度输出与实际准确率保持一致"}, {"key": "C", "text": "对模型输出进行后处理"}, {"key": "D", "text": "限制模型的输出词汇量"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 7, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-004", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Calibration\"（校准）在 Prompt 工程中是指什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 调整模型的训练超参数\u003c/li\u003e\n\u003cli\u003eB. 通过设计 Prompt 让模型的置信度输出与实际准确率保持一致\u003c/li\u003e\n\u003cli\u003eC. 对模型输出进行后处理\u003c/li\u003e\n\u003cli\u003eD. 限制模型的输出词汇量\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Calibration 指的是让模型表达的“我有多确定”和它实际答对的概率尽量一致。比如模型说自己 90% 确定时，希望它真的大约 90% 情况下是对的，而不是明明经常错却表现得很自信。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e调整训练超参数属于模型训练，不是 Prompt 工程里的校准。\u003c/li\u003e\n\u003cli\u003e后处理可能辅助校准，但不是这里的核心定义。\u003c/li\u003e\n\u003cli\u003e限制词汇量和置信度是否可靠没有直接关系。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCalibration = 让模型输出的置信度和实际准确率尽量匹配。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "校准是置信度与真实正确率在一批数据上的对应关系；单靠提示要求自信或不自信不等于已经校准。", "source_hash": "660d1eb1b293a348896afb74b5ce7be9ee2ddb4e3217fbdb32640c162f36b7b6"}, {"id": "03-005", "title": "2026-06-11 Prompt 工程与 Fine-tuning 的选择原则", "stem": "以下哪项正确描述了\"Prompt 工程\"与\"Fine-tuning\"的选择原则？", "options": [{"key": "A", "text": "Fine-tuning 总是优于 Prompt 工程"}, {"key": "B", "text": "当任务可以通过清晰的指令和示例完成时先用 Prompt 工程；当需要大量特定风格/知识/格式的适配时再考虑 Fine-tuning"}, {"key": "C", "text": "Prompt 工程只适合简单任务"}, {"key": "D", "text": "Fine-tuning 不需要数据，成本更低"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 2, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-005", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪项正确描述了\"Prompt 工程\"与\"Fine-tuning\"的选择原则？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. Fine-tuning 总是优于 Prompt 工程\u003c/li\u003e\n\u003cli\u003eB. 当任务可以通过清晰的指令和示例完成时先用 Prompt 工程；当需要大量特定风格/知识/格式的适配时再考虑 Fine-tuning\u003c/li\u003e\n\u003cli\u003eC. Prompt 工程只适合简单任务\u003c/li\u003e\n\u003cli\u003eD. Fine-tuning 不需要数据，成本更低\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： Prompt 工程通常成本低、迭代快，适合先验证任务能不能通过清晰指令、约束、示例和上下文解决。如果任务需要模型长期稳定地适配某种专业风格、固定格式、业务规则或大量领域样例，仅靠 Prompt 很难稳定时，再考虑 Fine-tuning。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFine-tuning 不是总是更好，它需要数据、训练成本和评估流程。\u003c/li\u003e\n\u003cli\u003ePrompt 工程不只适合简单任务，复杂任务也可以通过分解、RAG、工具调用、Prompt chaining 等方式解决。\u003c/li\u003e\n\u003cli\u003eFine-tuning 通常需要高质量训练数据，不是无数据、低成本方案。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e选择原则：先 Prompt 工程快速验证和迭代；Prompt 难以稳定适配大量特定模式时，再考虑 Fine-tuning。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "先用提示验证任务；稳定行为可考虑微调，而新鲜、可引用事实通常应由资料或检索补充。", "source_hash": "660d1eb1b293a348896afb74b5ce7be9ee2ddb4e3217fbdb32640c162f36b7b6"}, {"id": "03-006", "title": "2026-06-11 创意头脑风暴的 Prompt 设计", "stem": "以下哪种 Prompt 设计最适合让模型给出有创意的头脑风暴建议？", "options": [{"key": "A", "text": "\"请给出10个关于X的想法\""}, {"key": "B", "text": "\"请用发散思维列出20个关于X的创意，包括常规想法和非常规想法，不要自我审查，先数量后质量\""}, {"key": "C", "text": "\"请给出关于X最好的方案\""}, {"key": "D", "text": "\"请严格按照逻辑给出X的解决方案\""}], "answer": ["B"], "multiple": false, "official": false, "chapter": 11, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-006", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e以下哪种 Prompt 设计最适合让模型给出有创意的头脑风暴建议？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. \"请给出10个关于X的想法\"\u003c/li\u003e\n\u003cli\u003eB. \"请用发散思维列出20个关于X的创意，包括常规想法和非常规想法，不要自我审查，先数量后质量\"\u003c/li\u003e\n\u003cli\u003eC. \"请给出关于X最好的方案\"\u003c/li\u003e\n\u003cli\u003eD. \"请严格按照逻辑给出X的解决方案\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e结论： 正确选项：B\u003c/p\u003e\n\u003cp\u003e大白话解析： 头脑风暴的目标是先打开思路，而不是一开始就筛出唯一最优方案。B 明确要求发散思维、数量更多、包含常规和非常规想法，并且先数量后质量，这些都能鼓励模型输出更多样、更有创意的结果。\u003c/p\u003e\n\u003cp\u003e易错点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA 太普通，只要求数量，没有明确创意方向和发散要求。\u003c/li\u003e\n\u003cli\u003eC 会让模型过早收敛到一个“最好方案”，不适合头脑风暴阶段。\u003c/li\u003e\n\u003cli\u003eD 强调严格逻辑和解决方案，更适合分析或决策，不适合发散创意。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e知识点总结：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e创意头脑风暴 Prompt = 发散思维 + 多数量 + 常规/非常规都要 + 先数量后质量。\u003c/li\u003e\n\u003c/ul\u003e\n", "note": "B 中“不要自我审查”仅按创意阶段暂缓筛选理解，不能用来取消安全或业务边界。", "source_hash": "660d1eb1b293a348896afb74b5ce7be9ee2ddb4e3217fbdb32640c162f36b7b6"}, {"id": "03-007", "title": "2026-06-11 Least-to-most prompting 的思路", "stem": "\"Least-to-most prompting\"（由简到繁提示）技术的思路是什么？", "options": [{"key": "A", "text": "先给模型最简单的任务，再逐渐增加难度"}, {"key": "B", "text": "将复杂问题分解，先解决最简单的子问题，再将子问题的解用于解决更复杂的子问题"}, {"key": "C", "text": "从最少的 token 开始，逐渐增加 Prompt 长度"}, {"key": "D", "text": "先给出最少的约束，再逐渐收紧"}], "answer": ["B"], "multiple": false, "official": false, "chapter": 5, "source": "PromptEngenering/题目/历史题目_03.md", "anchor": "s-03-007", "record": "\u003cp\u003e来源：用户提供题目\u003c/p\u003e\n\u003cp\u003e题目：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Least-to-most prompting\"（由简到繁提示）技术的思路是什么？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e选项：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA. 先给模型最简单的任务，再逐渐增加难度\u003c/li\u003e\n\u003cli\u003eB. 将复杂问题分解，先解决最简单的子问题，再将子问题的解用于解决更复杂的子问题\u003c/li\u003e\n\u003cli\u003eC. 从最少的 token 开始，逐
